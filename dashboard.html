<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041F18">
<title>Painel de Produção CEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#041F18;--panel:#0A2F25;--panel2:#0F3A2E;--line:#17493A;--ink:#E6F5EE;--mute:#8DB5A5;--jade:#2BD48F;
--c0:#F2B04A;--c1:#2BD48F;--c2:#4CC3E8;--c3:#B79CFF;--danger:#FF7A6B;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 500px at 10% -10%,rgba(43,212,143,.12),transparent 60%),var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif;min-height:100vh;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,.num{font-family:'Space Grotesk',sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 60px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:clamp(20px,3vw,28px);margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 0 rgba(43,212,143,.6);animation:pulse 2s infinite}
.dot.demo{background:var(--c0);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(43,212,143,0)}100%{box-shadow:0 0 0 0 rgba(43,212,143,0)}}
.live{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px}
.live small{color:var(--mute)}
.ring{width:26px;height:26px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--jade);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ib{width:32px;height:32px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center}
.ib:hover{background:var(--line)}
.ib.spin svg{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--mute);font-weight:500}
.seg button.on{background:var(--jade);color:#04251B;font-weight:600}
select,input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
select option{background:var(--panel)}
input[type=search]{flex:1;min-width:160px;max-width:300px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--jade);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px}
.chip button{border:0;background:rgba(255,255,255,.1);border-radius:50%;width:20px;height:20px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{color:var(--mute);font-size:13px}
.kpi .num{font-size:32px;font-weight:600;line-height:1.15;margin:4px 0;letter-spacing:-.02em}
.d{font-size:12.5px;font-weight:500}.d.up{color:var(--jade)}.d.dn{color:var(--danger)}.d.eq{color:var(--mute)}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:16px;padding:6px}
.stg{position:relative;text-align:left;border:1.5px solid transparent;background:none;border-radius:11px;padding:12px 14px}
.stg:hover{background:var(--panel2)}
.stg.on{border-color:var(--jade);background:var(--panel2)}
.stg:not(:last-child)::after{content:"";position:absolute;right:-1px;top:50%;width:8px;height:8px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:translate(0,-50%) rotate(45deg)}
.stg .n{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px}
.stg .n i{width:9px;height:9px;border-radius:3px}
.stg .num{font-size:30px;font-weight:600}
.stg .s{font-size:12.5px;color:var(--mute)}
.stg .s b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
.card h2{font-size:16px;margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.leg{display:flex;gap:6px;flex-wrap:wrap}
.leg button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.leg button i{width:8px;height:8px;border-radius:50%}
.leg button.off{opacity:.4;text-decoration:line-through}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:11px}
.tip{position:absolute;pointer-events:none;background:#031712;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:3}
.tip b{display:block;margin-bottom:3px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.op{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:none;border-radius:10px;padding:8px 10px;margin-bottom:2px}
.op:hover{background:var(--panel2)}.op.on{border-color:var(--jade);background:var(--panel2)}
.op .t{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.op .t span{color:var(--mute);font-weight:400}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:6px}
.empty{color:var(--mute);padding:24px 0;text-align:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{border:0;background:none;padding:0;color:inherit;font-weight:inherit}
th button:hover{color:var(--ink)}
td{padding:10px;border-bottom:1px solid rgba(23,73,58,.6)}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--panel2)}
.cod{font-family:'Space Grotesk';font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.espera{background:rgba(242,176,74,.14);color:var(--c0)}
.pill.ativo{background:rgba(43,212,143,.15);color:var(--jade)}
.pill.pronto{background:rgba(76,195,232,.15);color:var(--c2)}
.pill.ativo::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.prog{display:flex;gap:3px;width:110px}
.prog i{flex:1;height:7px;border-radius:3px;background:var(--line)}
.prog i.f{background:var(--jade)}.prog i.a{background:var(--c0);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:none;border-radius:10px;padding:7px 16px}
.more:hover{background:var(--panel2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:11;overflow:auto;padding:22px 20px calc(30px + env(safe-area-inset-bottom))}
aside.on{transform:none}
aside h2{font-size:22px;margin:0 0 2px}
.tl{margin:18px 0 0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 18px 26px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl li.f::before{background:var(--jade);border-color:var(--jade)}.tl li.a::before{border-color:var(--c0);background:var(--c0)}
.tl b{display:block}.tl small{color:var(--mute);display:block}
.obs{margin-top:4px;background:rgba(255,122,107,.12);color:var(--danger);border-radius:8px;padding:6px 9px;font-size:13px}
.x{position:absolute;top:16px;right:16px}
.banner{background:rgba(242,176,74,.12);border:1px solid var(--c0);color:var(--c0);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.flash{animation:fl .8s}@keyframes fl{from{background:rgba(43,212,143,.25)}}
@media(max-width:900px){.grid{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(2,1fr)}.stg::after{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Painel de Produção CEPE</h1>
      <div class="sub"><span class="dot" id="dot"></span><span id="src">Conectando…</span><span id="upd"></span></div>
    </div>
    <div class="live" title="Atualização automática a cada 2 minutos">
      <small id="cd">2:00</small>
      <svg class="ring" viewBox="0 0 26 26"><circle class="bg" cx="13" cy="13" r="10"/><circle class="fg" id="fg" cx="13" cy="13" r="10" stroke-dasharray="62.8" stroke-dashoffset="0"/></svg>
      <button class="ib" data-a="auto" id="bAuto" aria-label="Pausar atualização automática" title="Pausar/retomar"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2" width="3" height="10"/><rect x="8" y="2" width="3" height="10"/></svg></button>
      <button class="ib" data-a="refresh" id="bRef" aria-label="Atualizar agora" title="Atualizar agora"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <div class="filters">
    <div class="seg" id="segDias"><button data-a="dias" data-v="7">7 dias</button><button data-a="dias" data-v="30" class="on">30 dias</button><button data-a="dias" data-v="90">90 dias</button></div>
    <select id="selCli" aria-label="Cliente"><option value="">Todos os clientes</option></select>
    <input type="search" id="q" placeholder="Buscar caixa ou cliente" aria-label="Buscar">
    <span id="chips"></span>
  </div>
  <section class="kpis" id="kpis"></section>
  <section class="card pipe" id="pipe"></section>
  <section class="grid">
    <div class="card">
      <div class="ch"><h2>Produção por dia</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><div class="seg" id="segMet"><button data-a="met" data-v="n" class="on">Etapas</button><button data-a="met" data-v="vol">Volume</button></div><div class="leg" id="leg"></div></div>
      </div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="card"><div class="ch"><h2>Operadores</h2><span class="sub" style="margin:0">clique para filtrar</span></div><div id="ops"></div></div>
  </section>
  <section class="card">
    <div class="ch"><h2>Caixas</h2><span class="sub" style="margin:0" id="tcount"></span></div>
    <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div id="moreWrap"></div>
  </section>
</div>
<div class="scrim" id="scrim" data-a="close"></div>
<aside id="drawer" aria-label="Detalhes da caixa"></aside>

<script type="module">
const FIREBASE_CONFIG={apiKey:"AIzaSyAhB7rOrqvEzXc7wdOexJk7VyN0cqt_1Js",authDomain:"grd-cepe.firebaseapp.com",projectId:"grd-cepe",storageBucket:"grd-cepe.firebasestorage.app",messagingSenderId:"857647856675",appId:"1:857647856675:web:6b652bca002e9fbcef0596"};
const INTERVALO=120; // segundos
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=[{k:'preparacao',n:'Preparação',wait:'novo',act:'preparando',q:null},{k:'captura',n:'Captura',wait:'preparado',act:'capturando',q:'qtdImagens'},{k:'inspecao',n:'Inspeção',wait:'capturado',act:'inspecionando',q:'qtdImagens'},{k:'indexacao',n:'Indexação',wait:'inspecionado',act:'indexando',q:'qtdConjuntos'}];
const INFO={novo:[1,'espera','Aguardando preparação'],preparando:[1,'ativo','Preparando'],preparado:[2,'espera','Aguardando captura'],capturando:[2,'ativo','Capturando'],capturado:[3,'espera','Aguardando inspeção'],inspecionando:[3,'ativo','Inspecionando'],inspecionado:[4,'espera','Aguardando indexação'],indexando:[4,'ativo','Indexando'],pronto:[5,'pronto','Pronto']};
const COR=['var(--c0)','var(--c1)','var(--c2)','var(--c3)'];
const S={dias:30,cli:'',etapa:0,op:'',q:'',met:'n',hide:{},sort:['act',-1],lim:25,auto:true};
let DATA=[],fonte='',resta=INTERVALO,ultimo=Date.now(),loading=false,CH=[],db=null,fsm=null;
const fN=n=>(n||0).toLocaleString('pt-BR');
const pad=n=>String(n).padStart(2,'0');
const fDT=t=>{if(!t)return '—';const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const fDur=ms=>{if(ms==null||ms<0)return '—';const m=Math.round(ms/6e4);return m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60)+' min'};
const iso=t=>new Date(t).toISOString();
const cliente=o=>((o.ficha&&o.ficha.cliente)||(o.origem&&o.origem.cliente)||'').trim()||'Sem cliente';
const atividade=o=>{let t=+new Date(o.criadoEm)||0;ST.forEach(s=>{const d=o[s.k]||{};[d.inicio,d.fim].forEach(x=>{if(x)t=Math.max(t,+new Date(x))})});return t};

/* ---------- Dados ---------- */
function demo(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;const cl=['SEFAZ-PE','Prefeitura do Recife','TJPE','Detran-PE','CPRH'],ops=['Ana Beatriz','Carlos Eduardo','Joana Lima','Marcos Vinicius','Paula Souza','Rafael Costa'];const now=Date.now(),out=[];
for(let n=0;n<80;n++){const t0=now-r()*34*864e5,age=(now-t0)/(34*864e5);const o={codigo:'CX-'+(2400+n),criadoEm:iso(t0),ficha:{cliente:cl[n%5]},status:'novo'};
ST.forEach(x=>o[x.k]={operador:null,matricula:null,inicio:null,fim:null,observacao:null});
const goal=r()<.2+.75*age?4:Math.floor(r()*4);let t=t0;
for(let i=0;i<4;i++){const d=o[ST[i].k],ini=t+(.2+r()*5)*36e5;if(ini>now)break;
 d.operador=ops[(n+i*2)%6];d.matricula='M'+((n+i*2)%6);d.inicio=iso(ini);
 if(i<goal){const fim=ini+(20+r()*160)*6e4;if(fim>now){o.status=ST[i].act;break}
  d.fim=iso(fim);t=fim;if(ST[i].q)d[ST[i].q]=i===3?40+(r()*300|0):800+(r()*4000|0);if(r()<.06)d.observacao='Documentos com umidade';
  o.status=i===3?'pronto':ST[i+1].wait}
 else{if(r()<.5)o.status=ST[i].act;else{d.operador=d.matricula=d.inicio=null;o.status=ST[i].wait}break}}
out.push(o)}
return out}
async function lerFirebase(){
 if(!db){const b='https://www.gstatic.com/firebasejs/10.12.2/';const [a,f]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-firestore.js')]);db=f.getFirestore(a.initializeApp(FIREBASE_CONFIG));fsm=f}
 const snap=await fsm.getDoc(fsm.doc(db,'cepe_producao','objetos'));
 return snap.exists()?JSON.parse(snap.data().v||'[]'):[]}
async function carregar(){
 if(loading)return;loading=true;$('#bRef').classList.add('spin');
 try{DATA=await Promise.race([lerFirebase(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('tempo esgotado')),9000))]);fonte='live'}
 catch(e){console.warn('Firebase indisponível:',e);if(fonte!=='live'||!DATA.length){DATA=demo();fonte='demo'}else fonte='erro'}
 loading=false;resta=INTERVALO;ultimo=Date.now();
 $('#dot').className='dot'+(fonte==='live'?'':' demo');
 $('#src').textContent=fonte==='live'?'Ao vivo · Firebase':fonte==='erro'?'Sem conexão · mostrando últimos dados':'Modo demonstração';
 $('#banner').innerHTML=fonte==='demo'?'<div class="banner">Não foi possível acessar o banco de dados daqui (rede ou regras do Firebase). Os dados abaixo são de exemplo. Hospede este arquivo junto do seu app e ele passa a mostrar os dados reais.</div>':'';
 $('#upd').textContent=' · atualizado às '+new Date().toLocaleTimeString('pt-BR');
 const sel=$('#selCli'),cur=S.cli;sel.innerHTML='<option value="">Todos os clientes</option>'+[...new Set(DATA.map(cliente))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
 render(true);setTimeout(()=>$('#bRef').classList.remove('spin'),700)}

/* ---------- Cálculos ---------- */
const dia0=()=>{const d=new Date();d.setHours(0,0,0,0);return +d};
function eventos(objs,from,to){const ev=[];objs.forEach(o=>ST.forEach((s,i)=>{const d=o[s.k];if(!d||!d.fim)return;const t=+new Date(d.fim);if(t>=from&&t<to)ev.push({o,i,op:d.operador||'—',t,q:s.q?(d[s.q]||0):0})}));return ev}
function soma(ev){const r={n:ev.length,cx:0,cap:0,ins:0,idx:0};ev.forEach(e=>{if(e.i===1)r.cap+=e.q;if(e.i===2)r.ins+=e.q;if(e.i===3){r.idx+=e.q;r.cx++}});return r}
const delta=(a,b)=>{if(!b&&!a)return '<span class="d eq">sem atividade</span>';if(!b)return '<span class="d up">novo no período</span>';const p=Math.round((a-b)/b*100);return `<span class="d ${p>0?'up':p<0?'dn':'eq'}">${p>0?'▲':p<0?'▼':'•'} ${Math.abs(p)}% vs. período anterior</span>`};

/* ---------- Render ---------- */
function render(flash){
 const objs=DATA.filter(o=>!S.cli||cliente(o)===S.cli);
 const hoje=dia0(),from=hoje-(S.dias-1)*864e5,to=hoje+864e5,from2=from-S.dias*864e5;
 const f=e=>!S.op||e.op===S.op;
 const ev=eventos(objs,from,to).filter(f),evP=eventos(objs,from2,from).filter(f);
 const a=soma(ev),b=soma(evP);
 const fila=objs.filter(o=>o.status!=='pronto').length,ativas=objs.filter(o=>(INFO[o.status]||[])[1]==='ativo').length;
 const K=[['Caixas na linha',fila,`<span class="d eq">${ativas} em atividade agora</span>`],['Caixas finalizadas',a.cx,delta(a.cx,b.cx)],['Etapas concluídas',a.n,delta(a.n,b.n)],['Imagens capturadas',a.cap,delta(a.cap,b.cap)],['Imagens inspecionadas',a.ins,delta(a.ins,b.ins)],['Conjuntos indexados',a.idx,delta(a.idx,b.idx)]];
 $('#kpis').innerHTML=K.map(k=>`<div class="card kpi ${flash?'flash':''}"><div class="l">${k[0]}</div><div class="num">${fN(k[1])}</div>${k[2]}</div>`).join('');
 // pipeline
 const cnt=i=>{const w=objs.filter(o=>INFO[o.status]&&INFO[o.status][0]===i&&INFO[o.status][1]==='espera').length,at=objs.filter(o=>INFO[o.status]&&INFO[o.status][0]===i&&INFO[o.status][1]==='ativo').length;return[w,at]};
 $('#pipe').innerHTML=ST.map((s,i)=>{const[w,at]=cnt(i+1);return`<button class="stg ${S.etapa===i+1?'on':''}" data-a="etapa" data-v="${i+1}"><div class="n"><i style="background:${COR[i]}"></i>${s.n}</div><div class="num">${w+at}</div><div class="s"><b>${at}</b> em andamento · <b>${w}</b> na fila</div></button>`}).join('')+
  `<button class="stg ${S.etapa===5?'on':''}" data-a="etapa" data-v="5"><div class="n"><i style="background:var(--mute)"></i>Prontas</div><div class="num">${objs.filter(o=>o.status==='pronto').length}</div><div class="s">total acumulado</div></button>`;
 chips();chart(ev,from);ops(ev);tabela(objs)}
function chips(){const c=[];if(S.op)c.push(['op','Operador: '+S.op]);if(S.etapa)c.push(['etapa',S.etapa===5?'Prontas':ST[S.etapa-1].n]);
 $('#chips').innerHTML=c.map(x=>`<span class="chip">${esc(x[1])}<button data-a="clr" data-v="${x[0]}" aria-label="Remover filtro">×</button></span>`).join(' ')}
function nice(m){m=m||1;const p=10**Math.floor(Math.log10(m));return[1,2,5,10].find(x=>x*p>=m)*p}
function chart(ev,from){
 const N=S.dias;CH=Array.from({length:N},(_,i)=>({t:from+i*864e5,v:[0,0,0,0]}));
 ev.forEach(e=>{const d=CH[Math.min(N-1,Math.max(0,Math.floor((e.t-from)/864e5)))];d.v[e.i]+=S.met==='vol'?e.q:1});
 const vis=i=>!S.hide[i],tot=d=>d.v.reduce((s,x,i)=>s+(vis(i)?x:0),0);
 const mx=nice(Math.max(...CH.map(tot))),W=760,H=250,L=44,R=6,T=10,B=24,bw=(W-L-R)/N,y=v=>T+(H-T-B)*(1-v/mx);
 let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#17493A" stroke-dasharray="${k?'3 4':'0'}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1e3?(v/1e3)+'k':v}</text>`}
 const step=Math.ceil(N/8);
 CH.forEach((d,i)=>{let acc=0;d.v.forEach((v,j)=>{if(!vis(j)||!v)return;const h=(H-T-B)*v/mx;g+=`<rect x="${L+i*bw+bw*.15}" y="${y(acc+v)}" width="${bw*.7}" height="${h}" fill="${['#F2B04A','#2BD48F','#4CC3E8','#B79CFF'][j]}" rx="${bw>8?2:0}"/>`;acc+=v});
  if(i%step===0){const dt=new Date(d.t);g+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${pad(dt.getDate())}/${pad(dt.getMonth()+1)}</text>`}});
 g+=`<line id="cur" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#E6F5EE" stroke-opacity=".35" visibility="hidden"/>`;
 $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" data-l="${L}" data-w="${W}" data-bw="${bw}">${g}</svg><div class="tip" id="tip"></div>`;
 $('#leg').innerHTML=ST.map((s,i)=>`<button class="${S.hide[i]?'off':''}" data-a="leg" data-v="${i}"><i style="background:${COR[i]}"></i>${s.n}</button>`).join('')}
function ops(ev){
 const m={};ev.forEach(e=>{const o=m[e.op]||(m[e.op]={n:0,q:0,v:[0,0,0,0]});o.n++;o.q+=e.q;o.v[e.i]++});
 let l=Object.entries(m).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
 if(S.op&&!m[S.op])l=[[S.op,{n:0,q:0,v:[0,0,0,0]}],...l];
 const mx=Math.max(1,...l.map(x=>x[1].n));
 $('#ops').innerHTML=l.length?l.map(([k,o])=>`<button class="op ${S.op===k?'on':''}" data-a="op" data-v="${esc(k)}"><div class="t">${esc(k)}<span>${o.n} etapas · ${fN(o.q)} un.</span></div><div class="bar" style="width:${o.n/mx*100}%">${o.v.map((v,i)=>`<span style="flex:${v};background:${COR[i]}"></span>`).join('')}</div></button>`).join(''):'<div class="empty">Sem produção no período.</div>'}
const COLS=[['codigo','Caixa'],['cli','Cliente'],['status','Situação'],['prog','Progresso'],['act','Última atividade'],['img','Imagens']];
function tabela(objs){
 const q=S.q.toLowerCase();
 let l=objs.filter(o=>(!S.etapa||(INFO[o.status]||[])[0]===S.etapa)&&(!S.op||ST.some(s=>(o[s.k]||{}).operador===S.op))&&(!q||(o.codigo+' '+cliente(o)).toLowerCase().includes(q)));
 const key={codigo:o=>o.codigo,cli:cliente,status:o=>(INFO[o.status]||[0])[0],prog:o=>ST.filter(s=>(o[s.k]||{}).fim).length,act:atividade,img:o=>(o.captura||{}).qtdImagens||0}[S.sort[0]];
 l.sort((x,y)=>{const a=key(x),b=key(y);return(a>b?1:a<b?-1:0)*S.sort[1]});
 $('#tcount').textContent=l.length+' de '+objs.length;
 $('#thead').innerHTML='<tr>'+COLS.map(c=>`<th><button data-a="sort" data-v="${c[0]}">${c[1]}${S.sort[0]===c[0]?(S.sort[1]>0?' ▲':' ▼'):''}</button></th>`).join('')+'</tr>';
 $('#tbody').innerHTML=l.slice(0,S.lim).map(o=>{const i=INFO[o.status]||[0,'espera',o.status];
  return`<tr data-a="open" data-v="${esc(o.codigo)}"><td class="cod">${esc(o.codigo)}</td><td>${esc(cliente(o))}</td><td><span class="pill ${i[1]}">${i[2]}</span></td><td><div class="prog">${ST.map(s=>`<i class="${(o[s.k]||{}).fim?'f':INFO[o.status]&&INFO[o.status][1]==='ativo'&&o.status===s.act?'a':''}"></i>`).join('')}</div></td><td>${fDT(atividade(o))}</td><td>${fN((o.captura||{}).qtdImagens)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Nenhuma caixa encontrada.</td></tr>';
 $('#moreWrap').innerHTML=l.length>S.lim?`<button class="more" data-a="more">Mostrar mais (${l.length-S.lim})</button>`:''}
function abrir(cod){
 const o=DATA.find(x=>x.codigo===cod);if(!o)return;const i=INFO[o.status]||[0,'espera',o.status];
 $('#drawer').innerHTML=`<button class="ib x" data-a="close" aria-label="Fechar">✕</button><h2>${esc(o.codigo)}</h2><div class="sub" style="margin-bottom:10px">${esc(cliente(o))}</div><span class="pill ${i[1]}">${i[2]}</span>
 <div class="sub" style="margin-top:10px">Recebida em ${fDT(o.criadoEm)}${o.origem&&o.origem.setor?' · '+esc(o.origem.setor):''}</div>
 <ul class="tl">${ST.map((s,k)=>{const d=o[s.k]||{},cl=d.fim?'f':o.status===s.act?'a':'';return`<li class="${cl}"><b>${s.n}</b><small>${d.operador?esc(d.operador):'Ainda não iniciada'}</small>${d.inicio?`<small>${fDT(d.inicio)} → ${fDT(d.fim)} · ${d.fim?fDur(+new Date(d.fim)-+new Date(d.inicio)):'em andamento'}</small>`:''}${s.q&&d[s.q]!=null?`<small>${fN(d[s.q])} ${s.q==='qtdConjuntos'?'conjuntos':'imagens'}</small>`:''}${d.observacao?`<div class="obs">⚠ ${esc(d.observacao)}</div>`:''}</li>`}).join('')}</ul>`;
 $('#drawer').classList.add('on');$('#scrim').classList.add('on')}
const fechar=()=>{$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')};

/* ---------- Eventos ---------- */
const A={
 dias(v){S.dias=+v;document.querySelectorAll('#segDias button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()},
 met(v){S.met=v;document.querySelectorAll('#segMet button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()},
 etapa(v){S.etapa=S.etapa===+v?0:+v;S.lim=25;render()},
 op(v){S.op=S.op===v?'':v;S.lim=25;render()},
 leg(v){S.hide[v]=!S.hide[v];render()},
 clr(v){if(v==='op')S.op='';else S.etapa=0;render()},
 sort(v){S.sort=S.sort[0]===v?[v,-S.sort[1]]:[v,v==='codigo'||v==='cli'?1:-1];render()},
 more(){S.lim+=25;render()},
 open:abrir,close:fechar,refresh:carregar,
 auto(){S.auto=!S.auto;$('#bAuto').innerHTML=S.auto?'<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2" width="3" height="10"/><rect x="8" y="2" width="3" height="10"/></svg>':'<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2l8 5-8 5z"/></svg>';$('#bAuto').setAttribute('aria-label',S.auto?'Pausar atualização automática':'Retomar atualização automática');tick(true)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.id==='scrim'&&e.target!==t)return;A[t.dataset.a]&&A[t.dataset.a](t.dataset.v)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar();if((e.key==='Enter')&&e.target.matches('tr[data-a]'))e.target.click()});
$('#selCli').addEventListener('change',e=>{S.cli=e.target.value;S.lim=25;render()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;S.lim=25;tabela(DATA.filter(o=>!S.cli||cliente(o)===S.cli))});
$('#chart').addEventListener('mousemove',e=>{const svg=$('#chart svg');if(!svg||!CH.length)return;const r=svg.getBoundingClientRect(),k=r.width/760,L=44,bw=(760-L-6)/CH.length;
 const i=Math.floor(((e.clientX-r.left)/k-L)/bw),tip=$('#tip'),cur=$('#cur');if(i<0||i>=CH.length){tip.style.opacity=0;cur.setAttribute('visibility','hidden');return}
 const d=CH[i],dt=new Date(d.t);cur.setAttribute('visibility','visible');cur.setAttribute('x1',L+i*bw+bw/2);cur.setAttribute('x2',L+i*bw+bw/2);
 tip.innerHTML=`<b>${dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}</b>`+ST.map((s,j)=>S.hide[j]?'':`<div><i style="background:${COR[j]}"></i>${s.n}: ${fN(d.v[j])}</div>`).join('');
 const x=(L+i*bw+bw/2)*k;tip.style.opacity=1;tip.style.left=Math.min(x+12,r.width-tip.offsetWidth-4)+'px';tip.style.top='10px'});
$('#chart').addEventListener('mouseleave',()=>{const t=$('#tip'),c=$('#cur');if(t)t.style.opacity=0;if(c)c.setAttribute('visibility','hidden')});

/* ---------- Atualização automática a cada 2 min ---------- */
function tick(soDesenhar){
 resta=Math.max(0,INTERVALO-Math.floor((Date.now()-ultimo)/1000));if(!S.auto)ultimo=Date.now()-(INTERVALO-resta)*1000;
 if(!soDesenhar&&S.auto&&!loading&&resta<=0)carregar();
 $('#cd').textContent=S.auto?Math.floor(resta/60)+':'+pad(resta%60):'pausado';
 $('#fg').setAttribute('stroke-dashoffset',62.8*(1-(S.auto?resta/INTERVALO:0)))}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.auto&&Date.now()-ultimo>INTERVALO*1000)carregar()});
carregar();
</script>
</body>
</html>
