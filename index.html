/* =========================================================
   FICHA — CONTROLE DE DIGITALIZAÇÃO (versão digital do F.001.01)
   Os dados de cada etapa vêm do sistema (login do operador, horários, quantidades).
   O restante é preenchido na própria ficha e salvo junto da caixa.
========================================================= */
const ETAPAS_FICHA = [
  {k:'preparacao', nome:'Preparação', qtdCampo:null, qtdLabel:null},
  {k:'captura',    nome:'Captura',    qtdCampo:'qtdImagens',   qtdLabel:'Imagens'},
  {k:'inspecao',   nome:'Inspeção',   qtdCampo:'qtdImagens',   qtdLabel:'Imagens'},
  {k:'indexacao',  nome:'Indexação',  qtdCampo:'qtdConjuntos', qtdLabel:'Indexações'}
];
function fmtDataCurta(iso){ return iso ? new Date(iso).toLocaleDateString('pt-BR') : '—'; }
function fmtHoraCurta(iso){ return iso ? new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—'; }
function iniciaisNome(n){
  if(!n) return '–';
  const p = n.trim().split(/\s+/);
  return ((p[0]||'')[0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase();
}
function fichaDoObjeto(o){
  const f = o.ficha || {};
  const auto = new Set(ETAPAS_FICHA.filter(e=>o[e.k] && o[e.k].observacao).map(e=>e.nome+': '+o[e.k].observacao));
  const lista = (Array.isArray(f.naoConformidades) ? f.naoConformidades : []).filter(r=>!auto.has(r.nc));
  while(lista.length < 4) lista.push({nc:'', disposicao:''});
  return {
    cliente:f.cliente||'', tipoDocumento:f.tipoDocumento||'', descricao:f.descricao||'', area:f.area||'',
    tipo:f.tipo||'', objeto:f.objeto||'',
    naoConformidades: lista, dispAuto: f.dispAuto||{},
    replace: f.replace||{}, tratamento: f.tratamento||{}, remontagem: f.remontagem||{},
    obsRemontagem: f.obsRemontagem||'', obsGerais: f.obsGerais||'',
    vistoDedig: f.vistoDedig||'', vistoContratada: f.vistoContratada||''
  };
}
function fxIn(id, val, tipo, ph, extra){
  return `<input class="fx-in" id="${id}" type="${tipo||'text'}" value="${escapeHtml(val==null?'':String(val))}" placeholder="${ph||''}" ${extra||''}>`;
}
function fxStatus(d){
  if(d && d.fim) return {cls:'ok', txt:'Concluída'};
  if(d && d.inicio) return {cls:'run', txt:'Em andamento'};
  return {cls:'', txt:'Pendente'};
}
function fxDtCelula(iso){
  return iso ? `<b>${fmtDataCurta(iso)}</b><span>${fmtHoraCurta(iso)}</span>` : '<span class="fx-vazio">—</span>';
}
function fxLinhaAuto(e, d){
  const st = fxStatus(d);
  const nome = nomeVisivel(d);
  const mostraMat = d.matricula && !(ehOperador() && d.matricula !== usuarioAtual.matricula);
  const qtd = e.qtdCampo ? d[e.qtdCampo] : null;
  return `<tr>
    <td class="c-et" data-label="Etapa"><b>${e.nome}</b><i class="fx-st ${st.cls}">${st.txt}</i></td>
    <td data-label="Colaborador">${nome ? `<div class="fx-colab"><span class="fx-av">${escapeHtml(nome==='Outro colaborador' ? '•' : iniciaisNome(nome))}</span><div><b>${escapeHtml(nome)}</b>${mostraMat?`<small>Mat. ${escapeHtml(d.matricula)}</small>`:''}</div></div>` : '<span class="fx-vazio">—</span>'}</td>
    <td class="c-dt" data-label="Início">${fxDtCelula(d.inicio)}</td>
    <td class="c-dt" data-label="Término">${fxDtCelula(d.fim)}</td>
    <td data-label="Duração">${d.inicio && d.fim ? fmtUtil(d.inicio, d.fim) : '<span class="fx-vazio">—</span>'}</td>
    <td data-label="Quantidade">${e.qtdCampo ? (qtd!=null ? `<b>${qtd}</b> ${e.qtdLabel.toLowerCase()}` : '<span class="fx-vazio">—</span>') : '<span class="fx-vazio">—</span>'}</td>
    <td data-label="Visto">${d.fim ? `<span class="fx-ok">✓ Visto digital</span><small>${escapeHtml(nome||'')}</small>` : '<span class="fx-vazio">Aguardando</span>'}</td>
  </tr>`;
}
function fxDuracaoManual(d){
  if(!d.iniData || !d.iniHora || !d.fimData || !d.fimHora) return '<span class="fx-vazio">—</span>';
  const a = new Date(d.iniData+'T'+d.iniHora), b = new Date(d.fimData+'T'+d.fimHora);
  if(isNaN(a) || isNaN(b) || b < a) return '<span class="fx-vazio">—</span>';
  return fmtDur(a.toISOString(), b.toISOString());
}
function fxLinhaManual(titulo, chave, d, qtdHTML){
  const pre = 'fi-'+chave;
  const concl = !!d.fimData;

async function abrirFicha(codigo){
  await carregarObjetos(); await carregarOperadores();
  const o = cacheObjetos.find(x=>x.codigo===codigo);
  if(!o) return;
  const root = document.getElementById('ficha-root');
  root.innerHTML = fxHTML(o);
  root.classList.add('aberta'); root.scrollTop = 0;
  document.body.classList.add('imprimindo-ficha');
  document.body.style.overflow = 'hidden';
}
function fecharFicha(){
  const root = document.getElementById('ficha-root');
  root.classList.remove('aberta'); root.innerHTML = '';
  document.body.classList.remove('imprimindo-ficha');
  document.body.style.overflow = '';
}
function fxVal(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function fxNum(id){ const v = fxVal(id); return v==='' ? null : parseInt(v,10); }
function coletarFicha(){
  const manual = (k)=>({nome:fxVal(`fi-${k}-nome`), iniData:fxVal(`fi-${k}-id`), iniHora:fxVal(`fi-${k}-ih`), fimData:fxVal(`fi-${k}-fd`), fimHora:fxVal(`fi-${k}-fh`)});
  const tra = manual('tratamento'); tra.erros = fxNum('fi-tratamento-erros'); tra.imagens = fxNum('fi-tratamento-imagens');
  const nc = [];
  for(let i=0; document.getElementById('fi-nc-'+i); i++) nc.push({nc:fxVal('fi-nc-'+i), disposicao:fxVal('fi-dp-'+i)});
  return {
    cliente:fxVal('fi-cliente'), tipoDocumento:fxVal('fi-tipoDoc'), descricao:fxVal('fi-desc'), area:fxVal('fi-area'),
    tipo:fxVal('fi-tipo'), objeto:fxVal('fi-objeto'),
    naoConformidades:nc, dispAuto:Object.fromEntries(ETAPAS_FICHA.map(e=>[e.k, fxVal('fi-dpa-'+e.k)])), tratamento:tra, remontagem:manual('remontagem'),
    obsRemontagem:fxVal('fi-obsRem'), obsGerais:fxVal('fi-obsGer'),
    vistoDedig:fxVal('fi-vistoDedig'), vistoContratada:fxVal('fi-vistoContr')
  };
}
async function salvarFicha(codigo, silencioso){
  const st = document.getElementById('fx-status');
  if(st){ st.className = 'fx-status'; st.textContent = 'Salvando…'; }
  let ok = false;
  try{
    const ficha = coletarFicha();
    await carregarObjetos();
    ok = await salvarObjetos(cacheObjetos.map(o=> o.codigo===codigo ? {...o, ficha:{...(o.ficha||{}), ...ficha}} : o));
  }catch(e){ console.error(e); ok = false; }
  if(st){
    if(ok){ st.className = 'fx-status'; st.textContent = '✓ Salvo às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
    else{ st.className = 'fx-status erro'; st.textContent = '⚠ Não foi possível salvar'; }
  }
  if(ok && !silencioso) mostrarToast('Ficha salva.');
  return ok;
}
async function imprimirFicha(codigo){
  await salvarFicha(codigo, true);
  setTimeout(()=>window.print(), 150);
}

/* Na impressão, campos de formulário viram texto (assim nada fica cortado) */
function fxPrepararImpressao(){
  const root = document.getElementById('ficha-root');
  if(!root) return;
  root.querySelectorAll('.fx-pv').forEach(e=>e.remove());
  root.querySelectorAll('input.fx-in, textarea.fx-in').forEach(el=>{
    let v = el.value || '';
    if(el.type==='date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) v = v.split('-').reverse().join('/');
    const div = document.createElement('div');
    div.className = 'fx-pv';

/* =========================================================
   RELATÓRIO DE PRODUÇÃO — geral (grupo), individual ou por cliente
   O cliente vem do campo "Cliente" da ficha de digitalização de cada caixa.
========================================================= */
const ETAPAS_REL = [
  {k:'preparacao', nome:'Preparação', q:null,           ql:''},
  {k:'captura',    nome:'Captura',    q:'qtdImagens',   ql:'imagens'},
  {k:'inspecao',   nome:'Inspeção',   q:'qtdImagens',   ql:'imagens'},
  {k:'indexacao',  nome:'Indexação',  q:'qtdConjuntos', ql:'indexações'}
];
function clientesConhecidos(){
  const mapa = new Map();
  cacheObjetos.forEach(o=>{ const c = ((o.ficha && o.ficha.cliente) || '').trim(); if(c && !mapa.has(c.toLowerCase())) mapa.set(c.toLowerCase(), c); });
  return Array.from(mapa.values()).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function eventosProducao(f){
  calcGaps();
  const ev = [];
  cacheObjetos.forEach(o=>{
    const cli = ((o.ficha && o.ficha.cliente) || '').trim();
    if(f.cliente && cli.toLowerCase() !== f.cliente.toLowerCase()) return;
    if(f.codigo && o.codigo !== f.codigo) return;
    ETAPAS_REL.forEach(e=>{
      if(f.etapa && f.etapa !== e.k) return;
      const d = o[e.k];
      if(!d || !d.fim) return;
      const dt = new Date(d.fim);
      if(f.mes && dt.getMonth()+1 !== Number(f.mes)) return;
      if(f.ano && dt.getFullYear() !== Number(f.ano)) return;
      if(f.de && +dt < f.de) return;
      if(f.ate && +dt >= f.ate) return;
      if(f.matricula && d.matricula !== f.matricula) return;
      ev.push({codigo:o.codigo, cliente:cli, etapa:e.nome, k:e.k, operador:d.operador||'—', matricula:d.matricula||'',
               inicio:d.inicio, fim:d.fim, qtd:e.q ? (d[e.q]||0) : null, ql:e.ql,
               w:d.inicio ? workMs(d.inicio, d.fim) : 0, g:(GAP[o.codigo+'|'+e.k] != null ? GAP[o.codigo+'|'+e.k] : null)});
    });
  });
  return ev;
}
function somarEventos(ev){
  const r = {prep:0, cap:0, capQtd:0, ins:0, insQtd:0, idx:0, idxQtd:0, w:0, g:0, caixas:new Set()};
  ev.forEach(x=>{
    r.caixas.add(x.codigo); r.w += x.w||0; r.g += x.g||0;
    if(x.k==='preparacao') r.prep++;
    else if(x.k==='captura'){ r.cap++; r.capQtd += x.qtd; }
    else if(x.k==='inspecao'){ r.ins++; r.insQtd += x.qtd; }
    else if(x.k==='indexacao'){ r.idx++; r.idxQtd += x.qtd; }
  });
  r.total = r.prep + r.cap + r.ins + r.idx;
  r.nCaixas = r.caixas.size;
  return r;
}
function agrupar(ev, chaveFn){
  const m = new Map();
  ev.forEach(x=>{ const k = chaveFn(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function textoPeriodo(mes, ano){
  if(mes && ano) return NOMES_MES[mes-1]+' de '+ano;
  if(mes) return NOMES_MES[mes-1]+' (todos os anos)';
  if(ano) return 'Ano de '+ano;
  return 'Todo o período';
}
function msEvento(x){ return x.inicio && x.fim ? workMs(x.inicio, x.fim) : null; }
function mediaMs(lista){
  const v = lista.map(msEvento).filter(n=>n!==null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function fmtMs(ms){
  if(ms===null || ms===undefined) return '—';
  let s = Math.floor(ms/1000);
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return (h?h+'h ':'') + (m?m+'min':(h?'':s+'s'));
}

function rpStats(itens){

      <tbody>${linhas.map(l=>`<tr><td><b>${escapeHtml(l.nome)}</b><br><span class="mono rp-mut">${escapeHtml(l.mat)}</span></td><td>${l.n}</td><td>${l.caixas}</td>${temQ?`<td>${l.qtd}</td>`:''}<td>${fmtMs(l.w)}</td><td>${fmtMs(l.media)}</td><td>${fmtMs(l.g)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total ${e.nome}</td><td>${evE.length}</td><td>${new Set(evE.map(x=>x.codigo)).size}</td>${temQ?`<td>${totQtd}</td>`:''}<td>${fmtMs(evE.reduce((a,x)=>a+x.w,0))}</td><td>${fmtMs(mediaMs(evE))}</td><td>${fmtMs(evE.reduce((a,x)=>a+(x.g||0),0))}</td></tr></tfoot>
      </table></div>`;

        <thead><tr><th>Data</th><th>Caixa</th><th>Cliente</th><th>Etapa</th><th>Início</th><th>Término</th><th>Tempo útil</th><th>Perdido antes</th><th>Quantidade</th></tr></thead>
        <tbody>${lista.map(x=>`<tr><td>${fmtDataCurta(x.fim)}</td><td class="mono">${escapeHtml(x.codigo)}</td><td>${escapeHtml(x.cliente||'—')}</td><td>${x.etapa}</td>
          <td>${fmtHoraCurta(x.inicio)}</td><td>${fmtHoraCurta(x.fim)}</td><td>${x.inicio ? fmtUtil(x.inicio, x.fim) : '—'}</td><td>${x.g!=null ? fmtMs(x.g) : '—'}</td><td>${x.qtd!==null ? x.qtd+' '+x.ql : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    }
  }else if(cfg.tipo==='setor'){
    const et = ETAPAS_REL.find(e=>e.k===cfg.etapa);
    titulo = 'Relatório de produção por setor';
    sub = et ? 'Setor: '+et.nome : 'Todos os setores — comparativo';
    if(!ev.length) corpo = vazio;
    else if(et){
      const temQ = !!et.q, qlab = rpLabelQtd(et.k);
      const linhas = Array.from(agrupar(ev, x=>x.matricula||x.operador).entries()).map(([mat, lista])=>{
        const u = cacheOperadores.find(o=>o.matricula===mat);
        return {nome: u ? u.nome : lista[0].operador, mat, n:lista.length, caixas:new Set(lista.map(x=>x.codigo)).size,
                qtd:lista.reduce((a,x)=>a+(x.qtd||0),0), media:mediaMs(lista), w:lista.reduce((a,x)=>a+x.w,0), g:lista.reduce((a,x)=>a+(x.g||0),0)};
      }).sort((a,b)=>b.n-a.n);
      const totQtd = ev.reduce((a,x)=>a+(x.qtd||0),0);
      corpo = rpStats([[ev.length,'Etapas concluídas'],[tot.nCaixas,'Caixas trabalhadas'],[temQ?totQtd:'—', temQ?qlab:'Quantidade'],[fmtMs(mediaMs(ev)),'Tempo médio por caixa'],[linhas.length,'Operadores'],[fmtMs(tot.w),'Tempo útil'],[fmtMs(tot.g),'Tempo perdido']])
      + `<div class="fx-sec">Produção por operador — ${et.nome}</div><div class="rp-wrap"><table class="rp-table">
        <thead><tr><th>Operador</th><th>Etapas concluídas</th><th>Caixas</th>${temQ?`<th>${qlab}</th>`:''}<th>Tempo útil</th><th>Tempo médio</th><th>Tempo perdido</th></tr></thead>
        <tbody>${linhas.map(l=>`<tr><td><b>${escapeHtml(l.nome)}</b><br><span class="mono rp-mut">${escapeHtml(l.mat)}</span></td><td>${l.n}</td><td>${l.caixas}</td>${temQ?`<td>${l.qtd}</td>`:''}<td>${fmtMs(l.w)}</td><td>${fmtMs(l.media)}</td><td>${fmtMs(l.g)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td><td>${ev.length}</td><td>${tot.nCaixas}</td>${temQ?`<td>${totQtd}</td>`:''}<td>${fmtMs(tot.w)}</td><td>${fmtMs(mediaMs(ev))}</td><td>${fmtMs(tot.g)}</td></tr></tfoot></table></div>
        <div class="fx-sec">Detalhamento</div>${rpDetalheEventos(ev)}`;
    }else{
      const linhas = ETAPAS_REL.map(e=>{
        const lista = ev.filter(x=>x.k===e.k);
        return {e, n:lista.length, caixas:new Set(lista.map(x=>x.codigo)).size, ops:new Set(lista.map(x=>x.matricula||x.operador)).size,
                qtd:lista.reduce((a,x)=>a+(x.qtd||0),0), media:mediaMs(lista), w:lista.reduce((a,x)=>a+x.w,0), g:lista.reduce((a,x)=>a+(x.g||0),0)};
      });
      corpo = rpStats([[tot.total,'Etapas concluídas'],[tot.nCaixas,'Caixas trabalhadas'],[tot.capQtd,'Imagens capturadas'],[tot.insQtd,'Imagens inspecionadas'],[tot.idxQtd,'Conjuntos indexados'],[fmtMs(tot.w),'Tempo útil'],[fmtMs(tot.g),'Tempo perdido']])
      + `<div class="fx-sec">Comparativo entre setores</div><div class="rp-wrap"><table class="rp-table">
        <thead><tr><th>Setor</th><th>Etapas concluídas</th><th>Caixas</th><th>Operadores</th><th>Quantidade</th><th>Tempo útil</th><th>Tempo médio</th><th>Tempo perdido</th></tr></thead>
        <tbody>${linhas.map(l=>`<tr><td><b>${l.e.nome}</b></td><td>${l.n}</td><td>${l.caixas}</td><td>${l.ops}</td><td>${l.e.q ? l.qtd+' '+l.e.ql : '—'}</td><td>${fmtMs(l.w)}</td><td>${fmtMs(l.media)}</td><td>${fmtMs(l.g)}</td></tr>`).join('')}</tbody></table></div>`;
    }
  }else if(cfg.tipo==='objeto'){
    const o = cacheObjetos.find(x=>x.codigo===cfg.codigo) || {};
    const fc = o.ficha || {};
    const cli = (fc.cliente||'').trim();
    titulo = 'Relatório por objeto (caixa)';
    sub = 'Caixa '+cfg.codigo+(cli ? ' · '+cli : '');
    nota = 'Mostra todas as etapas já iniciadas, inclusive as em andamento.' + NOTA_EXP;
    const linhas = ETAPAS_REL.map(e=>({e, d:o[e.k]||{}})).filter(x=>x.d.inicio);
    const concl = linhas.filter(x=>x.d.fim);
    const msTotal = concl.reduce((a,x)=>a+workMs(x.d.inicio, x.d.fim),0);
    const soma = k=>concl.filter(x=>x.e.k===k).reduce((a,x)=>a+(x.d[x.e.q]||0),0);
    const dh = iso=> iso ? fmtDataCurta(iso)+' '+fmtHoraCurta(iso) : '—';
    corpo = rpStats([[o.status && INFO_STATUS[o.status] ? INFO_STATUS[o.status].label : '—','Situação atual'],[concl.length,'Etapas concluídas'],[soma('captura'),'Imagens capturadas'],[soma('inspecao'),'Imagens inspecionadas'],[soma('indexacao'),'Conjuntos indexados']])
    + `<div class="fx-sec">Identificação</div><div class="rp-wrap"><table class="rp-table">
        <thead><tr><th>Cliente</th><th>Tipo de documento</th><th>Descrição</th><th>Recebida em</th><th>Tempo útil total</th></tr></thead>
        <tbody><tr><td>${escapeHtml(cli||'—')}</td><td>${escapeHtml(fc.tipoDocumento||'—')}</td><td>${escapeHtml(fc.descricao||'—')}</td><td>${dh(o.criadoEm)}</td><td>${concl.length ? fmtMs(msTotal) : '—'}</td></tr></tbody></table></div>
      <div class="fx-sec">Etapas</div>`
    + (linhas.length ? `<div class="rp-wrap"><table class="rp-table">
        <thead><tr><th>Etapa</th><th>Operador</th><th>Início</th><th>Término</th><th>Tempo útil</th><th>Perdido antes</th><th>Quantidade</th><th>Replace</th><th>Situação</th><th>Observação</th></tr></thead>
        <tbody>${linhas.map(({e,d})=>`<tr><td><b>${e.nome}</b></td><td>${escapeHtml(d.operador||'—')}</td><td>${dh(d.inicio)}</td><td>${dh(d.fim)}</td>
          <td>${d.inicio ? fmtUtil(d.inicio, d.fim||null) : '—'}</td><td>${GAP[cfg.codigo+'|'+e.k]!=null ? fmtMs(GAP[cfg.codigo+'|'+e.k]) : '—'}</td><td>${e.q ? (d[e.q]!=null ? d[e.q]+' '+e.ql : '—') : '—'}</td><td>${e.k==='inspecao' && d.qtdReplace!=null ? d.qtdReplace : '—'}</td>
          <td>${d.fim ? 'Concluída' : 'Em andamento'}</td><td>${escapeHtml(d.observacao||'—')}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="rp-vazio">Esta caixa ainda não passou por nenhuma etapa de produção.</div>');
  }else if(cfg.tipo==='cliente'){
    titulo = 'Relatório de produção por cliente';
    sub = 'Cliente: '+cfg.cliente;
    if(!ev.length) corpo = vazio;
    else{
      const porCaixa = Array.from(agrupar(ev, x=>x.codigo).entries()).map(([cod, lista])=>{
        const o = cacheObjetos.find(x=>x.codigo===cod) || {};
        const r = somarEventos(lista);
        const ultima = lista.reduce((m,x)=> !m || new Date(x.fim)>new Date(m) ? x.fim : m, null);
        return {cod, o, r, ultima};
      }).sort((a,b)=>new Date(a.ultima)-new Date(b.ultima));
      corpo = rpStats([[tot.nCaixas,'Caixas'],[tot.total,'Etapas concluídas'],[tot.capQtd,'Imagens capturadas'],[tot.insQtd,'Imagens inspecionadas'],[tot.idxQtd,'Conjuntos indexados'],[fmtMs(tot.w),'Tempo útil'],[fmtMs(tot.g),'Tempo perdido']])
      + `<div class="fx-sec">Caixas</div><div class="rp-wrap"><table class="rp-table">
        <thead><tr><th>Caixa</th><th>Situação</th><th>Recebida em</th><th>Imagens capt.</th><th>Imagens insp.</th><th>Conjuntos</th><th>Etapas</th><th>Tempo útil</th><th>Tempo perdido</th><th>Última etapa</th></tr></thead>
        <tbody>${porCaixa.map(c=>`<tr><td class="mono"><b>${escapeHtml(c.cod)}</b></td><td>${c.o.status && INFO_STATUS[c.o.status] ? INFO_STATUS[c.o.status].label : '—'}</td><td>${fmtDataCurta(c.o.criadoEm)}</td>
          <td>${c.r.capQtd}</td><td>${c.r.insQtd}</td><td>${c.r.idxQtd}</td><td>${c.r.total}</td><td>${fmtMs(c.r.w)}</td><td>${fmtMs(c.r.g)}</td><td>${fmtDataCurta(c.ultima)} ${fmtHoraCurta(c.ultima)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total (${tot.nCaixas})</td><td></td><td></td><td>${tot.capQtd}</td><td>${tot.insQtd}</td><td>${tot.idxQtd}</td><td>${tot.total}</td><td>${fmtMs(tot.w)}</td><td>${fmtMs(tot.g)}</td><td></td></tr></tfoot></table></div>
        <div class="fx-sec">Operadores neste cliente</div>${rpTabelaOperadores(ev)}`;
    }
  }else{
    titulo = 'Relatório de produção — grupo';
    sub = 'Todos os operadores';
    if(!ev.length) corpo = vazio;
    else{
      const porCli = Array.from(agrupar(ev, x=>x.cliente||'Sem cliente informado').entries()).map(([c, lista])=>({c, r:somarEventos(lista)})).sort((a,b)=>b.r.total-a.r.total);
      corpo = rpStats([[tot.total,'Etapas concluídas'],[tot.nCaixas,'Caixas trabalhadas'],[tot.capQtd,'Imagens capturadas'],[tot.insQtd,'Imagens inspecionadas'],[tot.idxQtd,'Conjuntos indexados'],[fmtMs(tot.w),'Tempo útil'],[fmtMs(tot.g),'Tempo perdido']])
      + `<div class="fx-sec">Produção por operador</div>${rpTabelaOperadores(ev)}
        <div class="fx-sec">Produção por cliente</div><div class="rp-wrap"><table class="rp-table">
        <thead><tr><th>Cliente</th><th>Caixas</th><th>Preparações</th><th>Imagens capt.</th><th>Imagens insp.</th><th>Conjuntos</th><th>Tempo útil</th><th>Tempo perdido</th><th>Total de etapas</th></tr></thead>
        <tbody>${porCli.map(x=>`<tr><td><b>${escapeHtml(x.c)}</b></td><td>${x.r.nCaixas}</td><td>${x.r.prep}</td><td>${x.r.capQtd}</td><td>${x.r.insQtd}</td><td>${x.r.idxQtd}</td><td>${fmtMs(x.r.w)}</td><td>${fmtMs(x.r.g)}</td><td><b>${x.r.total}</b></td></tr>`).join('')}</tbody></table></div>`;
    }
  }
  return `
  <div class="fx-bar no-print">
    <span class="fx-bar-t">${titulo}</span>
    <button class="btn btn-ghost btn-sm" onclick="fecharFicha()">Fechar</button>
    <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Imprimir / salvar PDF</button>
  </div>
  <div class="fx-page"><div class="fx-sheet rp-sheet">
    <div class="fx-head">
      ${logo ? `<img class="fx-logo" src="${logo}" alt="CEPE">` : ''}
      <div><h1>${titulo}</h1><div class="fx-sub">${escapeHtml(sub)}</div></div>
      <div class="fx-id"><span class="fx-chip">${escapeHtml(per)}</span><div class="fx-form">CEPE · Controle de Produção</div></div>
    </div>
    <div class="fx-body">${corpo}
      <div class="fx-foot"><span>${nota}</span><span>Emitido em ${new Date().toLocaleString('pt-BR')} por ${escapeHtml(usuarioAtual ? usuarioAtual.nome : '')}</span></div>
    </div>
  </div></div>`;
}
function abrirOpcoesRelatorio(){
  const anos = anosDisponiveis();
  const val = id=>{ const e = document.getElementById(id); return e ? e.value : ''; };
  const opSel = val('filtro-prod-operador'), mesSel = val('filtro-prod-mes'), anoSel = val('filtro-prod-ano');
  const clientes = clientesConhecidos();
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) fecharModal()">
      <div class="modal" style="max-width:480px;">
        <h3>Relatório de produção</h3>
        <div class="modal-sub">Escolha o tipo e o período. Depois é só imprimir ou salvar em PDF.</div>
        <label>Tipo de relatório</label>
        <select id="rel-tipo" onchange="relAtualizarCampos()">
          <option value="geral">Geral — todo o grupo</option>
          <option value="individual" ${opSel?'selected':''}>Individual — um operador</option>
          <option value="cliente">Por cliente</option>
          <option value="setor">Por setor (etapa)</option>
          <option value="objeto">Por objeto (caixa)</option>
        </select>
        <div id="rel-box-op" class="${opSel?'':'hidden'}">
          <label>Operador</label>
          <select id="rel-op">${cacheOperadores.map(o=>`<option value="${escapeHtml(o.matricula)}" ${o.matricula===opSel?'selected':''}>${escapeHtml(o.nome)} — ${escapeHtml(o.matricula)}</option>`).join('')}</select>
        </div>
        <div id="rel-box-cli" class="hidden">
          <label>Cliente</label>
          ${clientes.length ? `<select id="rel-cli">${clientes.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select>`
            : `<div class="hint">Nenhum cliente informado ainda. Preencha o campo <b>Cliente</b> na ficha de digitalização das caixas.</div><select id="rel-cli" class="hidden"></select>`}
        </div>
        <div id="rel-box-setor" class="hidden">
          <label>Setor</label>
          <select id="rel-setor"><option value="">Todos os setores (comparativo)</option>${ETAPAS_REL.map(e=>`<option value="${e.k}">${e.nome}</option>`).join('')}</select>
        </div>
        <div id="rel-box-obj" class="hidden">
          <label>Código da caixa</label>
          <input id="rel-obj" list="rel-obj-lista" placeholder="Digite ou escolha o código" autocomplete="off">
          <datalist id="rel-obj-lista">${cacheObjetos.map(o=>`<option value="${escapeHtml(o.codigo)}"></option>`).join('')}</datalist>
          <div class="hint">O relatório da caixa mostra todo o histórico dela, sem filtro de mês e ano.</div>
        </div>
        <div class="form-grid" id="rel-box-per">
          <div><label>Mês</label><select id="rel-mes"><option value="">Todos</option>${NOMES_MES.map((m,i)=>`<option value="${i+1}" ${String(i+1)===mesSel?'selected':''}>${m}</option>`).join('')}</select></div>
          <div><label>Ano</label><select id="rel-ano"><option value="">Todos</option>${anos.map(a=>`<option value="${a}" ${String(a)===anoSel?'selected':''}>${a}</option>`).join('')}</select></div>
        </div>
        <div class="err" id="rel-err"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
          <button class="btn btn-primary" style="margin-top:0;" onclick="gerarRelatorio()">Gerar relatório</button>
        </div>
      </div>
    </div>`;
}
function relAtualizarCampos(){
  const t = document.getElementById('rel-tipo').value;
  document.getElementById('rel-box-op').classList.toggle('hidden', t!=='individual');
  document.getElementById('rel-box-cli').classList.toggle('hidden', t!=='cliente');
  document.getElementById('rel-box-setor').classList.toggle('hidden', t!=='setor');
  document.getElementById('rel-box-obj').classList.toggle('hidden', t!=='objeto');
  document.getElementById('rel-box-per').classList.toggle('hidden', t==='objeto');
}
async function gerarRelatorio(){
  const tipo = document.getElementById('rel-tipo').value;
  const cfg = {tipo, mes:document.getElementById('rel-mes').value, ano:document.getElementById('rel-ano').value, matricula:'', cliente:'', etapa:'', codigo:''};
  const errEl = document.getElementById('rel-err');
  if(tipo==='individual'){ cfg.matricula = (document.getElementById('rel-op')||{}).value || ''; if(!cfg.matricula){ errEl.textContent = 'Escolha um operador.'; return; } }
  if(tipo==='cliente'){ cfg.cliente = (document.getElementById('rel-cli')||{}).value || ''; if(!cfg.cliente){ errEl.textContent = 'Nenhum cliente disponível. Informe o cliente na ficha das caixas.'; return; } }
  if(tipo==='setor') cfg.etapa = (document.getElementById('rel-setor')||{}).value || '';
  if(tipo==='objeto'){
    cfg.codigo = ((document.getElementById('rel-obj')||{}).value || '').trim(); cfg.mes = ''; cfg.ano = '';
    if(!cfg.codigo){ errEl.textContent = 'Informe o código da caixa.'; return; }
  }
  await carregarObjetos(); await carregarOperadores();
  if(tipo==='objeto'){
    const ach = cacheObjetos.find(o=>o.codigo.toLowerCase()===cfg.codigo.toLowerCase());
    if(!ach){ errEl.textContent = 'Caixa não encontrada. Confira o código.'; return; }
    cfg.codigo = ach.codigo;
  }
  fecharModal();
  const root = document.getElementById('ficha-root');
  root.innerHTML = relatorioHTML(cfg);
  root.classList.add('aberta'); root.scrollTop = 0;
  document.body.classList.add('imprimindo-ficha');
  document.body.style.overflow = 'hidden';
}

/* =========================================================
   TEMPO REAL — gestor acompanha tudo; operadores veem a fila atualizada
========================================================= */
let paraAoVivo = [], timerAoVivo = null, debAoVivo = null, debImport = null;
function telaOcupada(){
  if(document.getElementById('ficha-root').classList.contains('aberta')) return true;
  if(document.getElementById('modal-root').innerHTML.trim()) return true;
  const el = document.activeElement;
  return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}
function atualizarTelaAoVivo(){
  if(!usuarioAtual || telaOcupada()) return;
  if(usuarioAtual.tipo==='gestor') renderMainGestor();
  else renderMainOperador();
}
function agendarAtualizacao(){
  clearTimeout(debAoVivo);
  debAoVivo = setTimeout(atualizarTelaAoVivo, 350);
}
async function iniciarAoVivo(){
  pararAoVivo();
  const a = await Armazenar.observar('objetos', agendarAtualizacao);
  const b = await Armazenar.observar('operadores', agendarAtualizacao);
  const c = await Armazenar.observarExterno('grd_dados', 'objetosRecebidos', ()=>{ clearTimeout(debImport); debImport = setTimeout(importarDoRecebimento, 500); });
  paraAoVivo = [a, b, c];
  importarDoRecebimento();
  timerAoVivo = setInterval(()=>{ atualizarTelaAoVivo(); importarDoRecebimento(); }, 30000); // mantém as durações em dia e confere o recebimento
}
function pararAoVivo(){
  paraAoVivo.forEach(f=>{ try{ f(); }catch(e){} });
  paraAoVivo = [];
  clearInterval(timerAoVivo); clearTimeout(debAoVivo); clearTimeout(debImport);
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  await prepararLogin();
  const pin = document.getElementById('gestor-pin');
  if(pin) pin.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); entrarComoGestor(); } });
})();

/* =========================================================
   APP INSTALÁVEL (PWA)
========================================================= */
let promptInstalacao = null;
function jaInstalado(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function mostrarBoxInstalar(){
  const box = document.getElementById('install-box');
  const txt = document.getElementById('install-txt');
  const btn = document.getElementById('install-btn');
  if(!box || jaInstalado()) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(promptInstalacao){
    txt.textContent = 'Instale o app para abrir direto da tela inicial ou da área de trabalho.';
    btn.classList.remove('hidden'); box.classList.remove('hidden');
  }else if(ios){
    txt.innerHTML = 'Para instalar no iPhone/iPad: toque em <b>Compartilhar</b> (□↑) e depois em <b>Adicionar à Tela de Início</b>.';
    box.classList.remove('hidden');
  }
}
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptInstalacao = e; mostrarBoxInstalar(); });
window.addEventListener('appinstalled', ()=>{ promptInstalacao = null; document.getElementById('install-box').classList.add('hidden'); });
async function instalarApp(){
  if(!promptInstalacao) return;
  promptInstalacao.prompt();
  await promptInstalacao.userChoice;
  promptInstalacao = null;
  document.getElementById('install-box').classList.add('hidden');
}
mostrarBoxInstalar();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
