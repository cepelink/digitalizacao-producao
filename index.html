<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#062B22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Produção CEPE">
<meta name="application-name" content="Produção CEPE">
<title>Controle de Produção CEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F7F4;
    --surface:#FFFFFF;
    --line:#DCE8E2;
    --ink:#0E241C;
    --muted:#5B7268;
    --jade:#00875A;
    --jade-dark:#045C3E;
    --jade-deep:#062B22;
    --jade-soft:#DCF3E6;
    --jade-soft2:#C6EBD9;
    --amber:#C98A2A;
    --amber-soft:#FBEBD3;
    --danger:#C0392B;
    --danger-soft:#F8DEDA;
    --radius:10px;
    --shadow:0 1px 2px rgba(6,43,34,.06), 0 8px 24px -12px rgba(6,43,34,.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk', sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--jade-dark); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- Layout shells ---------- */
  #app{min-height:100vh;}
  .hidden{display:none !important;}

  /* Login */
  #tela-login{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(700px 400px at 15% 10%, rgba(0,135,90,.14), transparent 60%),
      radial-gradient(600px 500px at 90% 90%, rgba(0,135,90,.10), transparent 60%),
      var(--jade-deep);
    padding:24px;
  }
  .login-card{
    background:var(--surface); border-radius:16px; box-shadow:var(--shadow);
    width:100%; max-width:460px; padding:36px 32px; position:relative; overflow:hidden;
  }
  .login-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg, var(--jade), var(--jade-dark));
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .brand-mark{
    width:44px;height:44px;border-radius:9px;
    background:#FFFFFF;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    padding:5px; box-shadow:inset 0 0 0 1px rgba(6,43,34,.06);
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand h1{font-size:22px; margin:0; letter-spacing:-0.02em;}
  .brand-sub{color:var(--muted); font-size:13.5px; margin:2px 0 26px;}
  .tab-switch{display:flex; background:var(--jade-soft); border-radius:10px; padding:4px; margin-bottom:22px;}
  .tab-switch button{
    flex:1; border:none; background:transparent; padding:9px 0; border-radius:8px;
    font-weight:600; font-size:14px; color:var(--jade-dark); cursor:pointer;
  }
  .tab-switch button.active{background:var(--surface); box-shadow:var(--shadow); color:var(--ink);}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input, select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:15px; background:#FBFDFC; color:var(--ink);
  }
  input:focus, select:focus{border-color:var(--jade); background:#fff;}
  .btn{
    border:none; border-radius:8px; padding:11px 18px; font-weight:600; font-size:14.5px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .08s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--jade); color:#fff; width:100%; margin-top:20px; padding:12px;}
  .btn-primary:hover{background:var(--jade-dark);}
  .btn-ghost{background:transparent; color:var(--jade-dark); border:1.5px solid var(--jade-soft2);}
  .btn-ghost:hover{background:var(--jade-soft);}
  .btn-outline{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--jade);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-danger:hover{background:#f2c9c3;}
  .btn-sm{padding:7px 12px; font-size:13px;}
  .link-btn{background:none;border:none;color:var(--jade-dark);font-weight:600;font-size:13.5px;cursor:pointer;padding:0;}
  .err{color:var(--danger); font-size:13px; margin-top:8px; min-height:0;}
  .hint{color:var(--muted); font-size:12.5px; margin-top:10px; line-height:1.5;}

  /* Operator screen */
  #tela-operador{display:flex; min-height:100vh;}
  .side{
    width:230px; flex-shrink:0; background:var(--jade-deep); color:#dff2ea;
    padding:22px 14px; display:flex; flex-direction:column; gap:4px;
  }
  .side .brand{color:#fff; padding:0 10px 20px;}
  .side .brand h1{color:#fff; font-size:18px;}
  .side .brand-sub{color:#8fbfab; margin-bottom:0;}
  .side-user{
    background:rgba(255,255,255,.06); border-radius:10px; padding:12px; margin:14px 0 18px;
    font-size:13px; color:#c9e6d9;
  }
  .side-user b{color:#fff; font-size:14.5px; display:block; font-family:'Space Grotesk',sans-serif;}
  .navlink{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:8px;
    color:#c9e6d9; text-decoration:none; font-weight:500; font-size:14.5px; cursor:pointer;
    border:none; background:transparent; text-align:left; width:100%;
  }
  .navlink:hover{background:rgba(255,255,255,.06);}
  .navlink.active{background:var(--jade); color:#fff; font-weight:600;}
  .navlink .badge-count{
    margin-left:auto; background:rgba(255,255,255,.18); border-radius:20px; padding:1px 8px; font-size:12px;
  }
  .navlink.active .badge-count{background:rgba(255,255,255,.28);}
  .side-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.1);}

  .main{flex:1; padding:28px 34px; overflow-x:hidden; min-width:0;}
  .dash-frame{display:block; width:100%; height:calc(100vh - 56px); min-height:560px; border:0; border-radius:14px; background:#041F18;}
  @media (max-width:900px){ .dash-frame{height:calc(100vh - 150px);} }
  .main-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .main-head h2{font-size:24px; margin:0; letter-spacing:-0.01em;}
  .main-head p{color:var(--muted); margin:4px 0 0; font-size:14px;}
  .toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
  .toolbar input{max-width:260px;}
  .section-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:26px 0 12px;}
  .section-title:first-of-type{margin-top:0;}

  .card-list{display:flex; flex-direction:column; gap:10px;}
  .obj-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    box-shadow:var(--shadow);
  }
  .obj-code{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:17px;
    background:var(--jade-soft); color:var(--jade-dark); padding:6px 10px; border-radius:8px;
    letter-spacing:.03em;
  }
  .obj-meta{color:var(--muted); font-size:13px; min-width:150px;}
  .obj-meta b{color:var(--ink); font-weight:600;}
  .esteira{display:flex; align-items:center; gap:3px; flex:1; min-width:220px;}
  .esteira-node{display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; min-width:0;}
  .esteira-dot{width:13px;height:13px;border-radius:50%; background:var(--line); border:2px solid var(--line); flex-shrink:0;}
  .esteira-dot.done{background:var(--jade); border-color:var(--jade);}
  .esteira-dot.current{background:var(--amber-soft); border-color:var(--amber); animation:pulse 1.6s infinite;}
  .esteira-label{font-size:10px; color:var(--muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60px;}
  .esteira-label.done{color:var(--jade-dark); font-weight:600;}
  .esteira-label.current{color:var(--amber); font-weight:600;}
  .esteira-line{height:2px; background:var(--line); flex:1; margin-top:-16px;}
  .esteira-line.done{background:var(--jade);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,138,42,.35);}50%{box-shadow:0 0 0 5px rgba(201,138,42,.05);}}

  .obj-actions{display:flex; gap:8px; margin-left:auto;}
  .status-pill{
    font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .pill-wait{background:var(--jade-soft); color:var(--jade-dark);}
  .pill-active{background:var(--amber-soft); color:var(--amber);}
  .pill-done{background:var(--jade); color:#fff;}

  .empty-state{
    text-align:center; padding:46px 20px; color:var(--muted); background:var(--surface);
    border:1.5px dashed var(--line); border-radius:12px; font-size:14px;
  }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,43,34,.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background:#fff; border-radius:14px; padding:28px; width:100%; max-width:440px; box-shadow:var(--shadow);
    max-height:88vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 4px; font-size:19px;}
  .modal .modal-sub{color:var(--muted); font-size:13.5px; margin-bottom:18px;}
  .modal-actions{display:flex; gap:10px; margin-top:22px;}
  .modal-actions .btn{flex:1;}

  /* Gestor */
  #tela-gestor .main{padding:28px 34px;}
  .g-tabs{display:flex; gap:6px; margin-bottom:24px; border-bottom:1.5px solid var(--line);}
  .g-tab{
    padding:10px 4px; margin-right:22px; border:none; background:none; font-weight:600; font-size:14.5px;
    color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
  }
  .g-tab.active{color:var(--jade-dark); border-color:var(--jade);}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow);}
  .stat-card .num{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:var(--jade-dark);}
  .stat-card .lbl{font-size:12.5px; color:var(--muted); margin-top:2px;}

  table{width:100%; border-collapse:collapse; background:var(--surface); border-radius:12px; overflow:hidden; box-shadow:var(--shadow);}
  thead tr{background:var(--jade-soft);}
  th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--jade-dark); padding:11px 14px; font-weight:600;}
  td{padding:11px 14px; font-size:13.5px; border-top:1px solid var(--line); vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#F7FBF9;}
  .table-wrap{overflow-x:auto; border-radius:12px;}

  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px;}
  .detail-field{background:#F7FBF9; border:1px solid var(--line); border-radius:9px; padding:10px 12px;}
  .detail-field label{margin:0 0 4px;}
  .detail-field input, .detail-field select{padding:8px 9px; font-size:14px;}
  .detail-full{grid-column:1 / -1;}

  .op-row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:8px;}
  .op-row .mono{color:var(--muted); font-size:13px;}
  .op-row .nome{font-weight:600; flex:1;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--jade-deep); color:#fff; padding:11px 20px; border-radius:30px; font-size:13.5px;
    box-shadow:var(--shadow); z-index:3000; font-weight:500;
  }

  /* =========================================================
     RESPONSIVIDADE — celular, tablet e computador
  ========================================================= */
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  img{max-width:100%;}
  body{overflow-x:hidden; min-height:100vh; min-height:100dvh;}
  #app, #tela-login, #tela-operador{min-height:100vh; min-height:100dvh;}
  /* Tela do gestor: menu lateral + conteúdo lado a lado (igual à do operador) */
  #tela-gestor:not(.hidden){display:flex; min-height:100vh; min-height:100dvh;}
  #tela-operador:not(.hidden){display:flex;}
  .side{position:sticky; top:0; align-self:flex-start; height:100vh; height:100dvh; overflow-y:auto;}
  .main{flex:1 1 0; min-width:0;}
  textarea{max-width:100%;}

  /* Conteúdo não estica demais em telas muito grandes */
  .main{
    padding:clamp(16px, 2.4vw, 34px) clamp(14px, 2.8vw, 40px);
    padding-bottom:calc(clamp(16px, 2.4vw, 34px) + env(safe-area-inset-bottom, 0px));
  }
  .main > *{max-width:1480px;}
  #tela-gestor .main{padding:clamp(16px, 2.4vw, 34px) clamp(14px, 2.8vw, 40px);}
  .main-head h2{font-size:clamp(19px, 2.2vw, 26px);}
  .g-tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .g-tabs::-webkit-scrollbar{display:none;}
  .g-tab{white-space:nowrap; flex-shrink:0;}
  .table-wrap{-webkit-overflow-scrolling:touch;}
  .toast{max-width:calc(100vw - 32px); text-align:center; bottom:calc(20px + env(safe-area-inset-bottom, 0px));}

  /* Telas grandes (TV / monitor wide) */
  @media (min-width:1600px){
    .side{width:260px;}
    body{font-size:16px;}
    td{font-size:14.5px;}
  }

  /* Notebook / tablet deitado */
  @media (max-width:1100px){
    .side{width:200px; padding:18px 10px;}
    .navlink{padding:10px; font-size:14px;}
    .obj-card{gap:12px;}
    .esteira{min-width:180px;}
  }

  /* Tablet em pé e abaixo: menu lateral vira barra no topo */
  @media (max-width:880px){
    #tela-operador, #tela-gestor{flex-direction:column;}
    #tela-gestor:not(.hidden), #tela-operador:not(.hidden){display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;}
    .side{
      height:auto; align-self:stretch; overflow-y:visible;
      width:100%; flex-direction:row; align-items:center; gap:6px;
      overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
      padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top, 0px));
      position:sticky; top:0; z-index:50;
    }
    .side::-webkit-scrollbar{display:none;}
    .side .brand{padding:0 10px 0 0; margin:0; flex-shrink:0;}
    .side .brand .brand-sub{display:none;}
    .side .brand-mark{width:36px; height:36px;}
    .side-user{display:none;}
    .side-foot{margin:0 0 0 auto; padding:0; border:none; flex-shrink:0;}
    .navlink{white-space:nowrap; width:auto; flex-shrink:0; padding:10px 14px; min-height:42px;}
    .navlink .badge-count{margin-left:6px;}
    .detail-grid{grid-template-columns:1fr;}
    .obj-card{padding:14px;}
    .toolbar input{max-width:none; flex:1 1 200px;}
    td, th{padding:10px 10px;}
  }

  /* Celular */
  @media (max-width:640px){
    /* evita o zoom automático do iPhone ao tocar em campos */
    input, select, textarea{font-size:16px !important;}
    .btn, .navlink, .g-tab, .tab-switch button, .link-btn{min-height:44px;}
    .btn-sm{min-height:40px; padding:9px 14px;}

    #tela-login{padding:14px; align-items:flex-start; padding-top:max(14px, env(safe-area-inset-top, 0px));}
    .login-card{padding:26px 20px; margin:auto 0;}

    .main{padding:16px 12px 28px;}
    .main-head{margin-bottom:16px;}
    .main-head p{font-size:13px;}
    .section-title{margin:20px 0 10px;}
    .toolbar{gap:8px;}
    .toolbar > *{flex:1 1 100%;}
    .toolbar .btn{width:100%;}

    /* cartões de caixa empilhados */
    .obj-card{flex-direction:column; align-items:stretch; gap:10px;}
    .obj-card[style*="max-width"]{max-width:none !important;}
    .obj-code{align-self:flex-start; font-size:16px;}
    .obj-meta{min-width:0;}
    .esteira{min-width:0; width:100%; flex:none;}
    .esteira-label{font-size:9.5px; max-width:52px;}
    .status-pill{align-self:flex-start;}
    .obj-actions{margin-left:0; width:100%;}
    .obj-actions .btn{flex:1;}
    .op-row{flex-wrap:wrap;}
    .op-row .nome{flex:1 1 100%;}

    /* estatísticas em 2 colunas */
    .stat-grid{grid-template-columns:repeat(2, 1fr); gap:10px;}
    .stat-card{padding:12px 14px;}
    .stat-card .num{font-size:22px;}

    /* janelas (modal) viram painel inferior */
    .modal-overlay{align-items:flex-end; padding:0;}
    .modal{
      max-width:none !important; border-radius:18px 18px 0 0; padding:22px 18px;
      padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px)); max-height:92vh; max-height:92dvh;
    }
    .modal-actions{flex-direction:column-reverse;}

    /* tabelas viram lista de cartões (rótulos vêm do cabeçalho via script) */
    .table-wrap{overflow:visible; background:transparent; box-shadow:none;}
    table.resp, table.resp tbody, table.resp tr, table.resp td{display:block; width:100%;}
    table.resp{background:transparent; box-shadow:none; overflow:visible;}
    table.resp thead{display:none;}
    table.resp tr{
      background:var(--surface); border:1px solid var(--line); border-radius:12px;
      box-shadow:var(--shadow); margin-bottom:10px; padding:6px 0; overflow:hidden;
    }
    table.resp td{
      border-top:none; display:flex; justify-content:space-between; align-items:center; gap:14px;
      padding:7px 14px; text-align:right; min-width:0 !important;
    }
    table.resp td::before{
      content:attr(data-label); font-size:11px; font-weight:600; text-transform:uppercase;
      letter-spacing:.04em; color:var(--muted); text-align:left; flex-shrink:0;
    }
    table.resp td:not([data-label])::before{content:none;}
    table.resp td[data-label=""]::before{content:none;}
    table.resp td[colspan]{display:block; text-align:center;}
    table.resp td .esteira{max-width:230px;}
  }

  /* Celular bem pequeno */
  @media (max-width:360px){
    .brand h1{font-size:19px;}
    .login-card{padding:22px 16px;}
    .stat-grid{grid-template-columns:1fr;}
  }

  /* Celular deitado (pouca altura) */
  @media (max-height:480px) and (orientation:landscape){
    .modal-overlay{align-items:center; padding:10px;}
    .modal{border-radius:14px; max-height:94vh;}
    #tela-login{align-items:flex-start;}
  }

  /* Dispositivos de toque: sem efeito hover "grudado" */
  @media (hover:none){
    .btn-ghost:hover{background:transparent;}
    tbody tr:hover{background:inherit;}
  }

  /* ---------- Login por usuário/senha, instalação e cadastro de usuários ---------- */
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:46px;}
  .pw-toggle{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:40px; height:36px; border:none; background:transparent; cursor:pointer;
    font-size:16px; border-radius:8px; color:var(--muted);
  }
  .pw-toggle:hover{background:var(--jade-soft);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 14px;}
  .form-grid .full{grid-column:1 / -1;}
  .form-grid label{margin-top:10px;}
  .user-row{flex-wrap:wrap;}
  .user-row .user-main{flex:1 1 220px; min-width:0;}
  .user-row .sub{color:var(--muted); font-size:12.5px;}
  .pill-off{background:var(--danger-soft); color:var(--danger);}
  .etapas-check{display:flex; flex-wrap:wrap; gap:8px;}
  .etapa-op{
    display:flex; align-items:center; gap:8px; margin:0 !important; padding:9px 12px;
    border:1.5px solid var(--line); border-radius:8px; background:#FBFDFC; cursor:pointer;
    font-size:14px !important; font-weight:500 !important; color:var(--ink) !important;
    text-transform:none !important; letter-spacing:0 !important;
  }
  .etapa-op input{width:auto !important; padding:0 !important; margin:0; accent-color:var(--jade);}
  .etapa-op:has(input:checked){border-color:var(--jade); background:var(--jade-soft);}
  .ativo-row{cursor:pointer;}
  .ativo-row:hover{border-color:var(--jade);}
  .ativo-row .obj-meta{min-width:96px;}
  .install-box{
    margin-top:18px; padding:12px 14px; border-radius:10px; background:var(--jade-soft);
    font-size:13px; color:var(--jade-dark); line-height:1.5;
  }
  .install-box .btn{width:100%; margin-top:8px;}
  .modo-aviso{
    margin:0 0 14px; padding:9px 12px; border-radius:8px; background:var(--amber-soft);
    color:#7a5212; font-size:12.5px; line-height:1.45;
  }
  input[readonly]{background:#EEF4F1; color:var(--muted);}
  @media (max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    .user-row .obj-actions{margin-left:0; width:100%;}
    .user-row .obj-actions .btn{flex:1;}
  }

  /* =========================================================
     FICHA — Controle de Digitalização (versão digital do F.001.01)
  ========================================================= */
  #ficha-root{display:none;}
  #ficha-root.aberta{display:block; position:fixed; inset:0; z-index:1000; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .fx-bar{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px clamp(12px,3vw,28px); padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:rgba(255,255,255,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .fx-bar .fx-bar-t{font-weight:600; margin-right:auto; font-family:'Space Grotesk',sans-serif;}
  .fx-status{font-size:13px; font-weight:600; color:var(--jade-dark);}
  .fx-status.erro{color:var(--danger);}
  .fx-page{max-width:1120px; margin:0 auto; padding:clamp(12px,3vw,28px); padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));}
  .fx-sheet{background:#fff; border-radius:18px; box-shadow:0 10px 40px rgba(6,43,34,.10); overflow:hidden; border:1px solid var(--line);}
  .fx-head{
    background:linear-gradient(135deg,#062B22 0%,#0C4A39 55%,#12805f 100%); color:#fff;
    padding:clamp(14px,2.6vw,24px); display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  }
  .fx-logo{width:58px; height:58px; border-radius:14px; background:#fff; padding:4px; flex-shrink:0; object-fit:contain;}
  .fx-head h1{margin:0; font-family:'Space Grotesk',sans-serif; font-size:clamp(20px,3vw,26px); color:#fff; line-height:1.15;}
  .fx-head .fx-sub{color:#9fd3bd; font-size:13px; margin-top:3px;}
  .fx-head .fx-id{margin-left:auto; text-align:right;}
  .fx-chip{display:inline-block; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:5px 12px; font-size:13px;}
  .fx-chip b{font-family:'IBM Plex Mono',monospace; font-size:15px;}
  .fx-form{font-size:11.5px; color:#9fd3bd; margin-top:6px;}
  .fx-body{padding:clamp(14px,2.6vw,24px); display:flex; flex-direction:column; gap:18px;}
  .fx-sec{font-family:'Space Grotesk',sans-serif; font-size:12.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--jade-dark); margin:0 0 8px; display:flex; align-items:center; gap:10px;}
  .fx-sec::after{content:''; flex:1; height:1px; background:var(--line);}
  /* fases */
  .fx-fases{display:flex; align-items:center; flex-wrap:wrap; row-gap:8px;}
  .fx-fase{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); font-weight:500;}
  .fx-fase i{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-style:normal; font-weight:700; font-family:'Space Grotesk',sans-serif; background:#EEF4F1; color:var(--muted); border:2px solid #DCE8E2;}
  .fx-fase.done i{background:var(--jade); color:#fff; border-color:var(--jade);}
  .fx-fase.act i{background:#fff; color:var(--jade-dark); border-color:var(--jade);}
  .fx-fase.done, .fx-fase.act{color:var(--jade-dark);}
  .fx-fase-sep{width:clamp(14px,4vw,40px); height:2px; background:#DCE8E2; margin:0 8px;}
  .fx-fase-sep.done{background:var(--jade);}
  /* tabelas da ficha */
  .fx-twrap{border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  table.fx-t{width:100%; border-collapse:collapse; table-layout:fixed; font-size:13.5px;}
  .fx-t th{background:var(--jade-soft); color:var(--jade-dark); text-align:left; padding:8px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .fx-t td{padding:8px 10px; border-top:1px solid var(--line); vertical-align:middle; word-break:break-word; font-size:inherit;}
  .fx-t td small{display:block; color:var(--muted); font-size:11.5px; margin-top:1px;}
  .fx-t td b{font-weight:600;}
  .fx-t .lb{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:4px;}
  .fx-form-t td{border-top:none; border-right:1px solid var(--line); vertical-align:top;}
  .fx-form-t tr + tr td{border-top:1px solid var(--line);}
  .fx-form-t td:last-child{border-right:none;}
  .fx-form-t .val{font-weight:600; min-height:34px; padding-top:7px;}
  .c-et b{display:block; font-family:'Space Grotesk',sans-serif; font-size:14.5px; margin-bottom:4px;}
  .c-dt b{display:block; font-weight:600;} .c-dt span{display:block; color:var(--muted); font-size:12.5px;}
  .fx-st{display:inline-block; font-style:normal; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px; background:#EEF4F1; color:var(--muted);}
  .fx-st.ok{background:var(--jade-soft); color:var(--jade-dark);} .fx-st.run{background:var(--amber-soft); color:#7a5212;}
  .fx-colab{display:flex; align-items:center; gap:9px;}
  .fx-av{width:30px; height:30px; border-radius:50%; background:var(--jade-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:11px; flex-shrink:0;}
  .fx-ok{color:var(--jade-dark); font-weight:600; font-size:12.5px;}
  .fx-vazio{color:#9db1a8;}
  .fx-mini{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); font-weight:600; margin:2px 0;}
  .fx-mini .fx-in{padding:5px 8px;}
  .fx-etapas td.inp .fx-in + .fx-in{margin-top:5px;}
  .fx-in{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; font-size:13.5px; background:#FBFDFC; color:var(--ink,#0f2a22);}
  .fx-in:focus{outline:none; border-color:var(--jade); box-shadow:0 0 0 3px var(--jade-soft);}
  .fx-pv{display:none;}
  .fx-two{display:flex; gap:14px;} .fx-two > *{flex:1 1 0; min-width:0;}
  .fx-box{border:1px solid var(--line); border-radius:12px; padding:12px 14px; break-inside:avoid;}
  .fx-box > b{font-family:'Space Grotesk',sans-serif; font-size:13px; display:block; margin-bottom:6px;}
  .fx-box textarea.fx-in{min-height:78px; resize:vertical;}
  .fx-sign .fx-box{min-height:118px; display:flex; flex-direction:column; gap:8px;}
  .fx-sign .fx-line{margin-top:auto; border-top:1px solid #9bb5a9; padding-top:4px; font-size:11px; color:var(--muted); text-align:center;}
  .fx-foot{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--muted);}
  @media screen and (max-width:1000px){ .fx-etapas{font-size:12.5px;} .fx-t th, .fx-t td{padding:7px 6px;} }
  @media screen and (max-width:760px){
    .fx-head .fx-id{margin-left:0; text-align:left; width:100%;}
    .fx-fase span.t{display:none;}
    .fx-bar .btn{flex:1;}
    .fx-two{flex-direction:column;}
    .fx-twrap{border:none; border-radius:0; overflow:visible;}
    table.fx-t.fx-stack, .fx-stack thead, .fx-stack tbody, .fx-stack tr, .fx-stack td{display:block; width:100% !important;}
    .fx-stack thead{display:none;}
    .fx-stack tr{border:1px solid var(--line); border-radius:12px; margin-bottom:10px; padding:6px 0; background:#fff;}
    .fx-stack td{border:none !important; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 12px; text-align:right;}
    .fx-stack td::before{content:attr(data-label); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:left; flex-shrink:0;}
    .fx-stack td.c-et{justify-content:flex-start; gap:10px; background:var(--jade-soft); border-radius:10px 10px 0 0; margin-top:-6px; padding-top:9px; padding-bottom:9px;}
    .fx-stack td.c-et::before{display:none;} .fx-stack td.c-et b{margin:0;}
    .fx-stack td.inp{flex-direction:column; align-items:stretch; text-align:left; gap:4px;}
    .fx-form-t, .fx-form-t tbody, .fx-form-t tr, .fx-form-t td{display:block; width:100% !important;}
    .fx-form-t td{border-right:none !important; border-top:1px solid var(--line) !important;} .fx-form-t tr:first-child td:first-child{border-top:none !important;}
  }
  @media print{
    @page{size:A4; margin:8mm;}
    body.imprimindo-ficha > *:not(#ficha-root){display:none !important;}
    body.imprimindo-ficha{background:#fff !important;}
    #ficha-root.aberta{position:static; overflow:visible; background:#fff;}
    .fx-bar, .no-print{display:none !important;}
    .fx-page{max-width:none; padding:0;}
    .fx-sheet{box-shadow:none; border:none; border-radius:0; overflow:visible;}
    .fx-sheet, .fx-sheet *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .fx-head{padding:9px 14px; border-radius:10px;}
    .fx-logo{width:42px; height:42px;}
    .fx-head h1{font-size:19px;}
    .fx-body{display:block; padding:9px 0 0;}
    .fx-body > *{margin-bottom:9px;}
    .fx-sec{margin-bottom:4px; font-size:10.5px; break-after:avoid;}
    .fx-fases{gap:22px;} .fx-fase-sep{display:none;}
    .fx-fase i{width:22px; height:22px; font-size:11px;} .fx-fase{font-size:11px;}
    .fx-in{display:none !important;}
    .fx-pv{display:block; border-bottom:1px solid #b9cbc2; min-height:16px; padding:1px 0; font-size:11px; white-space:pre-wrap; word-break:break-word;}
    table.fx-t{font-size:10.5px;}
    .fx-t th{padding:4px 6px; font-size:9px;} .fx-t td{padding:3px 6px;}
    .fx-t tr{break-inside:avoid;}
    .fx-twrap{border-radius:8px;}
    .c-et b{font-size:11.5px; margin-bottom:2px;}
    .fx-av{width:20px; height:20px; font-size:8px;}
    .fx-two{gap:8px;} .fx-box{padding:6px 8px;} .fx-box textarea.fx-in{min-height:0;}
    .fx-sign .fx-box{min-height:70px;}
    .fx-mini{font-size:9.5px;}
  }
  .obj-card{flex-wrap:wrap;}
  .obj-obs{flex:1 1 100%; width:100%; background:var(--amber-soft); border:1px solid #ecd9a8; border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.45; color:#5d3f08;}
  .obj-obs b{display:block; margin-bottom:4px; font-size:12.5px;}
  .obj-obs-item{padding:3px 0;}
  .obj-obs-item small{color:#8a6a2a;}
  .obj-obs-tag{display:inline-block; background:#fff; border:1px solid #ecd9a8; border-radius:999px; padding:1px 9px; font-size:11.5px; font-weight:600; margin-right:4px;}
  .modal .obj-obs{margin:12px 0 4px;}
  .ao-vivo{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:#8fe0bd; padding:2px 14px 8px;}
  .ao-vivo i{width:9px; height:9px; border-radius:50%; background:#3ddc97; box-shadow:0 0 0 0 rgba(61,220,151,.6); animation:pulsoVivo 1.8s infinite;}
  @keyframes pulsoVivo{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55);}70%{box-shadow:0 0 0 8px rgba(61,220,151,0);}100%{box-shadow:0 0 0 0 rgba(61,220,151,0);}}
  @media (max-width:880px){ .ao-vivo{padding:0 6px; flex-shrink:0; white-space:nowrap;} }

  /* ---------- Relatório de produção ---------- */
  .rp-stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  .rp-stat{border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:#FBFDFC;}
  .rp-stat .n{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; color:var(--jade-dark);}
  .rp-stat .l{font-size:12px; color:var(--muted);}
  .rp-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  .rp-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .rp-table th{background:var(--jade-soft); color:var(--jade-dark); text-align:left; padding:9px 10px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
  .rp-table td{padding:8px 10px; border-top:1px solid var(--line); vertical-align:top;}
  .rp-table tfoot td{font-weight:700; background:#F1F7F4; border-top:2px solid var(--line);}
  .rp-mut{color:var(--muted); font-size:11.5px;}
  .rp-etapa{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:var(--jade-dark); margin:16px 0 6px; padding-left:8px; border-left:4px solid var(--jade); break-after:avoid;}
  .alerta-rapido{background:var(--danger-soft); border:1.5px solid var(--danger); border-radius:12px; padding:14px 16px; margin-bottom:22px;}
  .alerta-rapido .alerta-titulo{color:var(--danger); font-weight:800; font-size:15px;}
  .alerta-rapido .alerta-sub{color:var(--danger); font-size:12.5px; margin:2px 0 10px;}
  .alerta-lista{max-height:320px; overflow:auto; display:flex; flex-direction:column; gap:8px;}
  .alerta-item{display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:#fff; border:1px solid #F0B4B4; border-left:5px solid var(--danger); border-radius:8px; padding:10px 12px; cursor:pointer;}
  .alerta-item:hover{border-color:var(--danger);}
  .alerta-item .al-cx{min-width:110px;}
  .alerta-item .al-op{flex:1; min-width:140px;}
  .alerta-item .al-lbl{display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .alerta-item .al-dur{color:var(--danger); font-weight:800;}
  .rp-vazio{padding:30px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px;}
  @media screen and (max-width:760px){ .rp-stats{grid-template-columns:repeat(2,1fr);} }
  @media print{
    .rp-sheet{page:relatorio;}
    @page relatorio{size:A4 landscape; margin:9mm;}
    .rp-stats{grid-template-columns:repeat(5,1fr); gap:6px;}
    .rp-stat{padding:6px 8px;} .rp-stat .n{font-size:17px;}
    .rp-wrap{overflow:visible; border-radius:6px;}
    .rp-table{font-size:10.5px;} .rp-table th{padding:5px 6px; font-size:9.5px;} .rp-table td{padding:4px 6px;}
    .rp-table tr{break-inside:avoid;} .rp-table thead{display:table-header-group;}
  }
  .rec-ficha{border:1px solid var(--line); border-radius:12px; padding:10px 14px 12px; background:#FBFDFC;}
  .rec-ficha summary{cursor:pointer; font-weight:600; font-family:'Space Grotesk',sans-serif; padding:4px 0;}
  .rec-manter{display:flex; align-items:flex-start; gap:8px; margin-top:12px !important; font-size:13px; font-weight:500; color:var(--muted); text-transform:none; letter-spacing:0;}
  .rec-manter input{width:auto; margin-top:3px;}
  .rec-lookup{border-radius:10px; padding:9px 12px; font-size:13.5px; line-height:1.45; border:1px solid var(--line);}
  .rec-lookup.ok{background:var(--jade-soft); border-color:#bfe3d1; color:var(--jade-dark);}
  .rec-lookup.erro{background:var(--danger-soft); border-color:#f0c4c4; color:var(--danger); font-weight:500;}
  .rec-lookup.aviso{background:var(--amber-soft); border-color:#ecd9a8; color:#7a5212;}
</style>
</head>

      <div class="tab-switch">
        <button id="btn-tab-operador" class="active" onclick="trocarAbaLogin('operador')">Sou operador</button>
        <button id="btn-tab-gestor" onclick="trocarAbaLogin('gestor')">Gestor / Admin</button>

      <!-- Login operador -->
      <div id="login-operador">
        <form onsubmit="entrarComoOperador(event); return false;" autocomplete="on">
          <label for="op-login">Login</label>
          <input id="op-login" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Seu login">
          <label for="op-senha">Senha</label>
          <div class="pw-wrap">
            <input id="op-senha" name="password" type="password" autocomplete="current-password" placeholder="Sua senha">
            <button type="button" class="pw-toggle" onclick="alternarSenha('op-senha', this)" aria-label="Mostrar ou ocultar senha">👁</button>
          </div>
          <button type="submit" class="btn btn-primary" id="btn-entrar-op">Entrar</button>
          <div class="err" id="err-op-login"></div>
          <div class="hint">Ainda não tem acesso? Peça ao gestor para cadastrar seu login e senha.</div>
        </form>
      </div>

      <!-- Login gestor / administrador -->
      <div id="login-gestor" class="hidden">
        <form onsubmit="entrarComoGestor(event); return false;" autocomplete="on">
          <label for="g-login">Login</label>
          <input id="g-login" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Login de gestor ou admin">
          <label for="g-senha">Senha</label>
          <div class="pw-wrap">
            <input id="g-senha" name="password" type="password" autocomplete="current-password" placeholder="Sua senha">
            <button type="button" class="pw-toggle" onclick="alternarSenha('g-senha', this)" aria-label="Mostrar ou ocultar senha">👁</button>
          </div>
          <button type="submit" class="btn btn-primary" id="btn-entrar-g">Entrar</button>
          <div class="err" id="err-gestor"></div>
          <div class="hint">Acesso para gestores e administrador. Os gestores são cadastrados pelo administrador.</div>
        </form>
      </div>

      <div id="install-box" class="install-box hidden">
        <div id="install-txt"></div>
        <button id="install-btn" class="btn btn-ghost hidden" type="button" onclick="instalarApp()">📲 Instalar app</button>
      </div>

<script>
/* =========================================================
   ESTADO E CONSTANTES
========================================================= */
let usuarioAtual = null; // {tipo:'operador'|'gestor', nome, matricula}
let etapaAtualOperador = 'recebimento';
let abaAtualGestor = 'painel';
let cacheObjetos = [];
let cacheOperadores = [];

const NOMES_ETAPA = ['Recebido','Preparação','Captura','Inspeção','Indexação','Pronto'];

/* Etapas em que um operador pode trabalhar (marcadas no cadastro do usuário) */
const ETAPAS_TRABALHO = [
  {k:'preparacao', nome:'Preparação', espera:'novo',         ativo:'preparando'},
  {k:'captura',    nome:'Captura',    espera:'preparado',    ativo:'capturando'},
  {k:'inspecao',   nome:'Inspeção',   espera:'capturado',    ativo:'inspecionando'},
  {k:'indexacao',  nome:'Indexação',  espera:'inspecionado', ativo:'indexando'}
];
/* Etapas liberadas para o operador logado (lidas do cadastro, sempre atualizado) */
function etapasDoUsuario(){
  if(!usuarioAtual) return [];
  const u = cacheOperadores.find(o=>o.matricula===usuarioAtual.matricula);
  return u && Array.isArray(u.etapas) ? u.etapas : [];
}
/* Lote que o operador está trabalhando agora (em qualquer etapa) */
function loteEmAndamentoDoUsuario(matricula){
  for(const o of cacheObjetos){
    const et = ETAPAS_TRABALHO.find(e=>e.ativo===o.status);
    if(et && o[et.k] && o[et.k].matricula===matricula && !o[et.k].fim) return {obj:o, etapa:et};
  }
  return null;
}
/* Etapas que aparecem no menu: as liberadas + a do lote que ele já está trabalhando (para poder finalizar) */
function etapasVisiveisDoUsuario(){
  const v = etapasDoUsuario().slice();
  const a = usuarioAtual ? loteEmAndamentoDoUsuario(usuarioAtual.matricula) : null;
  if(a && !v.includes(a.etapa.k)) v.push(a.etapa.k);
  return v;
}
function aplicarMenuEtapas(){
  const vis = etapasVisiveisDoUsuario();
  ETAPAS_TRABALHO.forEach(e=>{
    const b = document.querySelector('#tela-operador .navlink[data-etapa="'+e.k+'"]');
    if(b) b.style.display = vis.includes(e.k) ? '' : 'none';
  });
}
function etapasCheckboxesHTML(prefixo, marcadas){
  return '<div class="etapas-check">' + ETAPAS_TRABALHO.map(e=>
    `<label class="etapa-op"><input type="checkbox" id="${prefixo}-etapa-${e.k}" ${marcadas.includes(e.k)?'checked':''}> ${e.nome}</label>`
  ).join('') + '</div>';
}
function lerEtapasMarcadas(prefixo){
  return ETAPAS_TRABALHO.filter(e=>{ const c = document.getElementById(prefixo+'-etapa-'+e.k); return c && c.checked; }).map(e=>e.k);
}
function nomesEtapas(lista){
  return ETAPAS_TRABALHO.filter(e=>(lista||[]).includes(e.k)).map(e=>e.nome).join(', ');
}

const INFO_STATUS = {
  novo:          {idx:1, fase:'espera',  label:'Aguardando preparação'},
  preparando:    {idx:1, fase:'ativo',   label:'Preparando'},
  preparado:     {idx:2, fase:'espera',  label:'Aguardando captura'},
  capturando:    {idx:2, fase:'ativo',   label:'Capturando'},
  capturado:     {idx:3, fase:'espera',  label:'Aguardando inspeção'},
  inspecionando: {idx:3, fase:'ativo',   label:'Inspecionando'},
  inspecionado:  {idx:4, fase:'espera',  label:'Aguardando indexação'},
  indexando:     {idx:4, fase:'ativo',   label:'Indexando'},
  pronto:        {idx:5, fase:'pronto',  label:'Pronto'}
};

/* =========================================================
   STORAGE HELPERS
========================================================= */
/* ---- Banco de dados -------------------------------------------------
   Para os dados ficarem COMPARTILHADOS entre todos os aparelhos (PC, celulares),
   cole abaixo a configuração do seu projeto Firebase (Firestore).
   Veja o passo a passo no LEIA-ME.txt.
   Sem configuração, o app funciona em "modo local" (dados só neste aparelho). */
const FIREBASE_CONFIG = {
  /* Mesmo projeto Firebase do app de recebimento (Gerador de GRD). */
  apiKey: "AIzaSyAhB7rOrqvEzXc7wdOexJk7VyN0cqt_1Js",
  authDomain: "grd-cepe.firebaseapp.com",
  projectId: "grd-cepe",
  storageBucket: "grd-cepe.firebasestorage.app",
  messagingSenderId: "857647856675",
  appId: "1:857647856675:web:6b652bca002e9fbcef0596"
};
/* exemplo:
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "...", projectId: "...", appId: "..."
};
*/

const Armazenar = (function(){
  let modo = null, db = null, fs = null, iniciando = null;
  async function iniciar(){
    if(modo) return modo;
    if(iniciando) return iniciando;
    iniciando = (async ()=>{
      if(window.storage && typeof window.storage.get === 'function'){ modo = 'claude'; return modo; }
      if(FIREBASE_CONFIG && FIREBASE_CONFIG.projectId){
        try{
          const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
          const [appMod, fsMod] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js')]);
          const app = appMod.initializeApp(FIREBASE_CONFIG);
          db = fsMod.getFirestore(app);
          fs = {doc:fsMod.doc, getDoc:fsMod.getDoc, setDoc:fsMod.setDoc, onSnapshot:fsMod.onSnapshot, runTransaction:fsMod.runTransaction};
          modo = 'firebase'; return modo;
        }catch(e){ console.error('Firebase indisponível', e); }
      }
      modo = 'local'; return modo;
    })();
    return iniciando;
  }
  async function get(chave){
    const m = await iniciar();
    if(m==='claude'){ try{ const r = await window.storage.get(chave, true); return r ? r.value : null; }catch(e){ return null; } }
    if(m==='firebase'){
      const snap = await fs.getDoc(fs.doc(db, 'cepe_producao', chave));
      return snap.exists() ? snap.data().v : null;
    }
    return localStorage.getItem('cepe:'+chave);
  }
  async function set(chave, valor){
    const m = await iniciar();
    if(m==='claude'){ await window.storage.set(chave, valor, true); return; }
    if(m==='firebase'){ await fs.setDoc(fs.doc(db, 'cepe_producao', chave), {v: valor, atualizadoEm: new Date().toISOString()}); return; }
    localStorage.setItem('cepe:'+chave, valor);
  }
  /* Acompanhamento em tempo real: Firebase usa onSnapshot; nos demais modos, consulta a cada 4 s */
  async function observar(chave, aoMudar){
    const m = await iniciar();
    let ultimo = null, ativo = true, timer = null, cancelar = null;
    if(m==='firebase'){
      cancelar = fs.onSnapshot(fs.doc(db, 'cepe_producao', chave), snap=>{
        const v = snap.exists() ? snap.data().v : null;
        if(v !== ultimo){ ultimo = v; if(ativo) aoMudar(v); }
      }, ()=>{});
    }else{
      const ciclo = async ()=>{
        try{ const v = await get(chave); if(v !== ultimo){ const primeira = ultimo===null && !ciclo.rodou; ultimo = v; ciclo.rodou = true; if(ativo && !primeira) aoMudar(v); } }catch(e){}
      };
      ciclo(); timer = setInterval(ciclo, 4000);
    }
    return ()=>{ ativo = false; if(timer) clearInterval(timer); if(cancelar) cancelar(); };
  }
  /* Leitura (somente leitura) de dados de outro app no mesmo Firebase, ex.: grd_dados/objetosRecebidos */
  async function lerExterno(colecao, chave){
    const m = await iniciar();
    if(m!=='firebase') return null;
    const snap = await fs.getDoc(fs.doc(db, colecao, chave));
    if(!snap.exists()) return null;
    const d = snap.data();
    return d.value !== undefined ? d.value : d.v;
  }
  /* Observa um documento de outro app (somente leitura) */
  async function observarExterno(colecao, chave, aoMudar){
    const m = await iniciar();
    if(m!=='firebase') return ()=>{};
    return fs.onSnapshot(fs.doc(db, colecao, chave), ()=>aoMudar(), ()=>{});
  }
  /* Leitura + gravação atômicas (várias pessoas ao mesmo tempo não se atropelam).
     leituras: [{col, chave}]; aplicar(valores) devolve {chaveDeCepe_producao: textoNovo} ou null. */
  async function transacao(leituras, aplicar){
    const m = await iniciar();
    if(m!=='firebase') return 0;
    return fs.runTransaction(db, async tx=>{
      const vals = {};
      for(const l of leituras){
        const snap = await tx.get(fs.doc(db, l.col, l.chave));
        let v = null;
        if(snap.exists()){ const d = snap.data(); v = d.value !== undefined ? d.value : d.v; }
        vals[l.col+'/'+l.chave] = v;
      }
      const saida = aplicar(vals);
      if(!saida) return 0;
      const agora = new Date().toISOString();
      Object.keys(saida).forEach(k=> tx.set(fs.doc(db, 'cepe_producao', k), {v:saida[k], atualizadoEm:agora}));
      return Object.keys(saida).length;
    });
  }
  return {iniciar, get, set, observar, observarExterno, transacao, lerExterno, modo:()=>modo};
})();

/* ---- Senhas (hash PBKDF2 — a senha nunca fica guardada em texto) ---- */
const TEM_CRYPTO = !!(window.crypto && window.crypto.subtle);
function bytesParaB64(buf){ let t=''; new Uint8Array(buf).forEach(b=>t+=String.fromCharCode(b)); return btoa(t); }
async function hashSenha(senha, saltB64){
  if(!TEM_CRYPTO) return {alg:'plain', hash:senha, salt:null};
  const salt = saltB64 ? Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0)) : crypto.getRandomValues(new Uint8Array(16));
  const chave = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, chave, 256);
  return {alg:'pbkdf2', hash:bytesParaB64(bits), salt:bytesParaB64(salt)};
}
async function definirSenha(usuario, senha){
  const h = await hashSenha(senha);
  usuario.senhaHash = h.hash; usuario.salt = h.salt; usuario.alg = h.alg;
}
async function conferirSenha(usuario, senha){
  if(!usuario.senhaHash) return false;
  if(usuario.alg==='plain') return usuario.senhaHash === senha;
  if(!TEM_CRYPTO) return false;
  const h = await hashSenha(senha, usuario.salt);
  return h.hash === usuario.senhaHash;
}

/* =========================================================
   UTIL
========================================================= */
function nowISO(){ return new Date().toISOString(); }
function fmtDT(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtDur(iso1, iso2){
  if(!iso1) return '—';
  const a = new Date(iso1); const b = iso2 ? new Date(iso2) : new Date();
  let s = Math.max(0, Math.floor((b-a)/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return (h?h+'h ':'') + (m?m+'min':(h?'':s+'s'));
}
/* ---- Tempo útil: só conta o expediente ----
   07:30–12:00, 13:00–15:00 e 15:15–16:30 (almoço 12:00–13:00 e lanche 15:00–15:15 não contam).
   DIAS_UTEIS: 1=segunda … 5=sexta. Inclua 6 se houver expediente aos sábados. */
const EXPEDIENTE = [[450,720],[780,900],[915,990]]; // minutos desde 00:00
const DIAS_UTEIS = [1,2,3,4,5];
function workMs(a, b){
  a = +new Date(a); b = +new Date(b);
  if(!(b > a)) return 0;
  let tot = 0; const d0 = new Date(a); d0.setHours(0,0,0,0);
  for(let t = +d0; t < b;){
    if(DIAS_UTEIS.includes(new Date(t).getDay())){
      for(const [x,y] of EXPEDIENTE){ const u = Math.max(a, t+x*6e4), v = Math.min(b, t+y*6e4); if(v > u) tot += v-u; }
    }
    const n = new Date(t); n.setDate(n.getDate()+1); t = +n;
  }
  return tot;
}
function fmtUtil(iso1, iso2){
  if(!iso1) return '—';
  return fmtMs(workMs(iso1, iso2 || new Date()));
}
/* Tempo perdido: intervalo (só dentro do expediente) entre o fim de um lote e o início do próximo do mesmo operador.
   GAP['CODIGO|etapa'] = ms perdidos ANTES de o operador iniciar aquele lote. */
let GAP = {};
function calcGaps(){
  GAP = {}; const m = {};
  cacheObjetos.forEach(o=>ETAPAS_REL.forEach(e=>{
    const d = o[e.k]; if(!d || !d.inicio || !d.fim) return;
    const id = d.matricula || d.operador; if(!id) return;
    (m[id] = m[id] || []).push({a:+new Date(d.inicio), b:+new Date(d.fim), k:o.codigo+'|'+e.k});
  }));
  Object.values(m).forEach(l=>{
    l.sort((x,y)=>x.a-y.a); let fim = l[0].b;
    for(let j=1; j<l.length; j++){ if(l[j].a >= fim) GAP[l[j].k] = workMs(fim, l[j].a); fim = Math.max(fim, l[j].b); }
  });
}
function gerarCodigo(existentes){
  let tentativa;
  do{ tentativa = String(Math.floor(100000 + Math.random()*900000)); }
  while(existentes.some(o=>o.codigo===tentativa));
  return tentativa;
}

function renderEsteira(status){
  const info = INFO_STATUS[status] || INFO_STATUS.novo;
  let html = '<div class="esteira">';
  for(let n=0; n<=5; n++){
    let dotClass = '', lblClass = '';
    if(n < info.idx || (n===info.idx && info.fase==='pronto')){ dotClass='done'; lblClass='done'; }
    else if(n === info.idx && info.fase==='ativo'){ dotClass='current'; lblClass='current'; }
    html += `<div class="esteira-node">
        <div class="esteira-dot ${dotClass}"></div>
        <div class="esteira-label ${lblClass}">${NOMES_ETAPA[n]}</div>
      </div>`;
    if(n<5){
      const lineDone = n < info.idx ? 'done' : '';
      html += `<div class="esteira-line ${lineDone}"></div>`;
    }
  }
  html += '</div>';
  return html;
}
function statusPillClass(status){
  const f = (INFO_STATUS[status]||{}).fase;
  if(f==='ativo') return 'pill-active';
  if(f==='pronto') return 'pill-done';
  return 'pill-wait';
}

const DESTINOS_VALIDOS = ['Produção', 'Envio direto', 'A definir'];
let cacheRecebGRD = {mapa:null, em:0};
async function carregarMapaRecebimentoGRD(){

function acharObjetoGRD(mapa, codigo){
  if(mapa[codigo]) return {chave:codigo, info:mapa[codigo]};
  const baixo = codigo.toLowerCase();
  for(const k of Object.keys(mapa)){ if(k.toLowerCase() === baixo) return {chave:k, info:mapa[k]}; }
  if(/^\d{1,5}$/.test(codigo)){ const p = codigo.padStart(6, '0'); if(mapa[p]) return {chave:p, info:mapa[p]}; }
  return null;
}
async function consultarRecebimentoGRD(codigo){
  codigo = (codigo || '').trim();
  if(!codigo) return {estado:'vazio'};
  if(Armazenar.modo() !== 'firebase') return {estado:'indisponivel'};
  try{
    const mapa = await carregarMapaRecebimentoGRD();
    const a = acharObjetoGRD(mapa, codigo);
    if(!a) return {estado:'nao_encontrado'};
    return {estado:'ok', chave:a.chave, info:a.info, destino: DESTINOS_VALIDOS.includes(a.info.destino) ? a.info.destino : 'A definir'};
  }catch(e){ console.warn('Consulta ao recebimento falhou', e); return {estado:'erro'}; }
}
function dataISOparaBR(iso){ return iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? iso.slice(0,10).split('-').reverse().join('/') : ''; }
function recebidaEmTexto(o){
  if(o.origem && o.origem.data) return dataISOparaBR(o.origem.data) + (o.origem.hora ? ' · ' + o.origem.hora : '');
  return fmtDataCurta(o.criadoEm) + ' · ' + fmtHoraCurta(o.criadoEm);

function renderHintRecebimento(res){
  const el = document.getElementById('rec-lookup');
  if(!el) return;

  if(res.estado === 'ok'){
    const i = res.info;
    const base = [i.cliente, i.setor, i.tipo].filter(Boolean).map(escapeHtml).join(' · ');
    if(res.destino === 'Produção'){ cls = 'ok'; txt = `✓ Encontrado no recebimento: ${base} · Destino: <b>Produção</b>`; }
    else if(res.destino === 'Envio direto'){ cls = 'erro'; txt = `⚠ ${base}<br>Este objeto está marcado como <b>ENVIO DIRETO</b> — não vai para a produção.`; }

  else if(res.estado === 'erro'){ cls = 'aviso'; txt = 'Não foi possível consultar o app de recebimento agora.'; }
  el.className = 'rec-lookup ' + cls;

  el.style.display = txt ? '' : 'none';

let importandoRecebimento = false;
async function importarDoRecebimento(){
  if(Armazenar.modo() !== 'firebase' || importandoRecebimento) return 0;
  importandoRecebimento = true;
  let n = 0;
  try{
    n = await Armazenar.transacao(
      [{col:'grd_dados', chave:'objetosRecebidos'}, {col:'cepe_producao', chave:'objetos'}, {col:'cepe_producao', chave:'importacao_ignorados'}],
      v=>{
        const mapa = v['grd_dados/objetosRecebidos'] ? JSON.parse(v['grd_dados/objetosRecebidos']) : {};
        const lista = v['cepe_producao/objetos'] ? JSON.parse(v['cepe_producao/objetos']) : [];
        const ignorados = new Set(v['cepe_producao/importacao_ignorados'] ? JSON.parse(v['cepe_producao/importacao_ignorados']) : []);
        const existentes = new Set(lista.map(o=>o.codigo));
        const novos = Object.keys(mapa)
          .filter(c=> mapa[c] && mapa[c].destino === 'Produção' && !existentes.has(c) && !ignorados.has(c))
          .sort((a,b)=> ((mapa[a].data||'')+(mapa[a].hora||'')+a).localeCompare((mapa[b].data||'')+(mapa[b].hora||'')+b))
          .map(c=>criarObjetoDoRecebimento(c, mapa[c]));
        if(!novos.length) return null;
        const saidaTxt = JSON.stringify([...lista, ...novos]);
        // Cada documento do Firestore aceita no máximo ~1 MB; passou disso a gravação é recusada.
        if(new Blob([saidaTxt]).size > 1040000) throw new Error('lista de caixas passou do limite de 1 MB do Firestore');
        return {objetos: saidaTxt};
      });
  }catch(e){ console.error('Não foi possível importar do recebimento', e); n = 0; avisarFalhaImportacao(e); }
  importandoRecebimento = false;
  if(n){ await carregarObjetos(); mostrarToast('Novas caixas chegaram do recebimento.'); atualizarTelaAoVivo(); }
  return n;
}
let ultimoAvisoImport = 0;
function avisarFalhaImportacao(e){
  if(Date.now() - ultimoAvisoImport < 300000) return; // no máx. 1 aviso a cada 5 min
  ultimoAvisoImport = Date.now();
  mostrarToast('⚠ Falha ao puxar caixas do recebimento: ' + ((e && (e.code || e.message)) || 'erro desconhecido'));
}
/* Diagnóstico: no navegador (F12 → Console) digite  diagnosticoImportacao()  e veja por que uma caixa não entrou. */
window.diagnosticoImportacao = async function(){

  const existentes = new Set(lista.map(o=>o.codigo));
  const codigos = Object.keys(mapa);
  const destProd = codigos.filter(c=>mapa[c] && mapa[c].destino==='Produção');
  const r = {
    modo: Armazenar.modo(),
    objetosNoRecebimento: codigos.length,
    comDestinoProducao: destProd.length,
    destinoEnvioDireto: codigos.filter(c=>mapa[c] && mapa[c].destino==='Envio direto').length,
    destinoADefinir: codigos.filter(c=>!mapa[c] || !['Produção','Envio direto'].includes(mapa[c].destino)).length,
    jaNaProducao: destProd.filter(c=>existentes.has(c)).length,
    bloqueadosPorExclusaoAnterior: destProd.filter(c=>!existentes.has(c) && ign.has(c)),
    pendentesParaImportar: destProd.filter(c=>!existentes.has(c) && !ign.has(c)),
    tamanhoKB: { objetosRecebidos: Math.round(new Blob([rawMapa||'']).size/1024), objetosProducao: Math.round(new Blob([rawObj||'']).size/1024), limiteFirestoreKB: 1024 }
  };
  console.log(r);
  return r;
};
async function ignorarNaImportacao(codigos){
  try{
    const raw = await Armazenar.get('importacao_ignorados');
    const lista = new Set(raw ? JSON.parse(raw) : []);
    codigos.forEach(c=>lista.add(c));
    await Armazenar.set('importacao_ignorados', JSON.stringify(Array.from(lista)));
  }catch(e){ console.warn('Não foi possível registrar exclusão para a importação', e); }
}

async function registrarCaixa(){
  const inp = document.getElementById('input-novo-codigo');
  const errEl = document.getElementById('err-recebimento');
  const digitado = inp.value.trim();
  errEl.textContent = '';
  if(!digitado){ errEl.textContent = 'Informe um código ou texto de identificação.'; return; }

  // Consulta ao app de recebimento: só o que for "Produção" segue; envio direto e não encontrados pedem confirmação
  const res = await consultarRecebimentoGRD(digitado);
  let codigo = digitado;
  if(res.estado === 'ok'){
    codigo = res.chave;
    if(res.destino === 'Envio direto' && !confirm('⚠ O objeto ' + codigo + ' está marcado como ENVIO DIRETO (não vai para a produção).\n\nRegistrar na produção mesmo assim?')) return;
  }else if(res.estado === 'nao_encontrado'){
    if(!confirm('O objeto ' + digitado + ' não foi encontrado no app de recebimento.\n\nRegistrar na produção mesmo assim?')) return;
  }else if(res.estado === 'erro'){
    if(!confirm('Não foi possível consultar o app de recebimento agora.\n\nRegistrar ' + digitado + ' mesmo assim?')) return;
  }

  await carregarObjetos();
  if(cacheObjetos.some(o=>o.codigo===codigo)){ errEl.textContent = 'Já existe uma caixa com esse código.'; return; }
  const v = id=>{ const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const cab = {cliente:v('rec-cliente'), tipoDocumento:v('rec-tipoDoc'), descricao:v('rec-desc'), area:v('rec-area'), tipo:v('rec-tipo'), objeto:v('rec-objeto')};
  let origem = null;
  if(res.estado === 'ok'){
    const i = res.info;
    cab.cliente = cab.cliente || i.cliente || '';
    cab.descricao = cab.descricao || i.setor || '';
    cab.objeto = cab.objeto || res.chave;
    origem = {cliente:i.cliente||'', setor:i.setor||'', tipoCaixa:i.tipo||'', refCliente:i.refCliente||'', data:i.data||'', hora:i.hora||'', destino:res.destino};
  }
  const objeto = {
    codigo, criadoEm: nowISO(), status:'novo', ficha: cab, origem, registradoPor: usuarioAtual.matricula, registradoPorNome: usuarioAtual.nome,
    preparacao:{operador:null,matricula:null,inicio:null,fim:null,observacao:null},
    captura:{operador:null,matricula:null,inicio:null,fim:null,qtdImagens:null,observacao:null},
    inspecao:{operador:null,matricula:null,inicio:null,fim:null,qtdImagens:null,qtdReplace:null,observacao:null},
    indexacao:{operador:null,matricula:null,inicio:null,fim:null,qtdConjuntos:null,observacao:null}
  };
  if(!(await salvarObjetos([...cacheObjetos, objeto]))) return;
  mostrarToast(res.estado === 'ok' && res.destino === 'A definir'
    ? `Caixa ${codigo} registrada — destino ainda não definido no recebimento.`
    : `Caixa ${codigo} registrada.`);
  const manter = !!(document.getElementById('rec-manter') && document.getElementById('rec-manter').checked);
  cabecalhoRec = manter ? {...cab, manter:true} : {cliente:'', tipoDocumento:'', descricao:'', area:'', tipo:'', objeto:'', manter:false};
  inp.value='';
  renderMainOperador();
}

async function puxarLote(codigo, campo, statusAtivo){
  await carregarObjetos();
  await carregarOperadores();
  if(!etapasDoUsuario().includes(campo)){
    mostrarToast('Você não está liberado para esta etapa. Fale com o gestor.');
    renderMainOperador(); return;
  }
  const emAnd = loteEmAndamentoDoUsuario(usuarioAtual.matricula);
  if(emAnd){
    mostrarToast(`Finalize o lote ${escapeHtml(emAnd.obj.codigo)} (${emAnd.etapa.nome}) antes de puxar outro.`);
    renderMainOperador(); return;
  }
  const et = ETAPAS_TRABALHO.find(e=>e.k===campo);
  const alvo = cacheObjetos.find(o=>o.codigo===codigo);
  if(!et || !alvo || alvo.status!==et.espera){
    mostrarToast('Este lote não está mais disponível.');
    renderMainOperador(); return;
  }
  const lista = cacheObjetos.map(o=>{
    if(o.codigo!==codigo) return o;
    const novo = {...o};
    novo[campo] = {...novo[campo], operador:usuarioAtual.nome, matricula:usuarioAtual.matricula, inicio:nowISO(), fim:null};
    novo.status = statusAtivo;
    return novo;
  });
  await salvarObjetos(lista);
  mostrarToast(`Lote ${codigo} puxado para ${INFO_STATUS[statusAtivo].label.toLowerCase()}.`);
  renderMainOperador();
}

let finalizarContexto = null;

        <div class="err" id="err-finalizar"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="confirmarFinalizar()">Confirmar</button>
        </div>
      </div>
    </div>`;
}
function fecharModal(){ document.getElementById('modal-root').innerHTML=''; finalizarContexto=null; }

const PROX_STATUS = {
  preparacao: 'preparado',
  captura: 'capturado',
  inspecao: 'inspecionado',
  indexacao: 'pronto'
};
const CAMPO_QTD = {
  captura: 'qtdImagens',
  inspecao: 'qtdImagens',
  indexacao: 'qtdConjuntos'
};
async function confirmarFinalizar(){
  const {codigo, campo, precisaQtd} = finalizarContexto;
  let qtd = null;
  if(precisaQtd){
    const inp = document.getElementById('input-qtd-finalizar');
    qtd = parseInt(inp.value, 10);
    if(!qtd || qtd<=0){
      document.getElementById('err-finalizar').textContent = 'Informe uma quantidade válida maior que zero.';
      return;
    }
  }
  let qtdReplace = null;
  if(campo==='inspecao'){
    const r = document.getElementById('input-replace-finalizar');
    qtdReplace = r && r.value !== '' ? parseInt(r.value, 10) : 0;
    if(isNaN(qtdReplace) || qtdReplace < 0){
      document.getElementById('err-finalizar').textContent = 'Informe uma quantidade válida de imagens inseridas (0 ou mais).';
      return;
    }
  }
  const obsInp = document.getElementById('input-obs-finalizar');
  const observacao = obsInp && obsInp.value.trim() ? obsInp.value.trim() : null;
  await carregarObjetos();
  const lista = cacheObjetos.map(o=>{
    if(o.codigo!==codigo) return o;
    const novo = {...o};
    novo[campo] = {...novo[campo], fim:nowISO(), observacao};
    if(precisaQtd) novo[campo][CAMPO_QTD[campo]] = qtd;
    if(campo==='inspecao') novo[campo].qtdReplace = qtdReplace;
    novo.status = PROX_STATUS[campo];
    return novo;
  });
  await salvarObjetos(lista);
  fecharModal();
  mostrarToast(observacao ? `Lote ${codigo} finalizado com observação registrada.` : `Lote ${codigo} finalizado.`);
  renderMainOperador();
}

async function abrirTelaGestor(){
  document.getElementById('tela-login').classList.add('hidden');
  document.getElementById('tela-operador').classList.add('hidden');
  document.getElementById('tela-gestor').classList.remove('hidden');
  const adm = ehAdmin();
  document.getElementById('nav-g-operadores').style.display = adm ? '' : 'none';
  document.getElementById('nav-g-config').style.display = adm ? '' : 'none';
  document.getElementById('g-side-user').innerHTML = adm
    ? '<b>Administrador</b>Acesso total e cadastro de usuários'
    : `<b>${escapeHtml(usuarioAtual.nome)}</b>Gestor · acompanha tudo em tempo real`;
  await carregarObjetos();
  await carregarOperadores();
  irParaAbaGestor('painel');
}
function irParaAbaGestor(aba){
  abaAtualGestor = aba;

    b.classList.toggle('active', b.dataset.gtab===aba);

}

function telaDashboardGestor(){
  return '<iframe id="iframe-dash" class="dash-frame" title="Dashboard de produção"></iframe>';
}
async function renderMainGestor(){
  if((abaAtualGestor==='operadores' || abaAtualGestor==='config') && !ehAdmin()) abaAtualGestor = 'painel';
  const main = document.getElementById('main-gestor');
  /* o dashboard cuida da própria atualização: não recarregar o quadro a cada mudança do banco */
  if(abaAtualGestor==='dashboard' && main.querySelector('#iframe-dash')) return;
  await carregarObjetos();
  await carregarOperadores();
  if(abaAtualGestor==='painel') main.innerHTML = await telaPainelGestor();
  else if(abaAtualGestor==='dashboard'){ main.innerHTML = telaDashboardGestor(); document.getElementById('iframe-dash').srcdoc = DASHBOARD_HTML; }
  else if(abaAtualGestor==='producao'){ await carregarOS(); main.innerHTML = telaProducaoOperador(); }
  else if(abaAtualGestor==='operadores') main.innerHTML = telaOperadoresGestor();
  else if(abaAtualGestor==='config') main.innerHTML = await telaConfigGestor();
}

const LIMITE_ALERTA_MIN = 5;   // lote concluído em menos que isso (minutos) vai para o alerta da gestão
function lotesRapidos(){
  const lista = [];
  cacheObjetos.forEach(o=>{
    ETAPAS_TRABALHO.forEach(et=>{
      const d = o[et.k];
      if(!d || !d.inicio || !d.fim || d.alertaVisto) return;
      if(new Date(d.fim) - new Date(d.inicio) < LIMITE_ALERTA_MIN*60000) lista.push({o, et, d});
    });
  });
  return lista.sort((a,b)=>new Date(b.d.fim) - new Date(a.d.fim));
}
function blocoAlertasRapidos(){
  const itens = lotesRapidos();
  if(!itens.length) return '';
  return `<div class="alerta-rapido">
    <div class="alerta-titulo">⚠ Lotes finalizados em menos de ${LIMITE_ALERTA_MIN} minutos (${itens.length})</div>
    <div class="alerta-sub">Confira se a etapa foi realmente executada. Depois de verificar, marque como conferido para tirar da lista.</div>
    <div class="alerta-lista">${itens.map(({o,et,d})=>`
      <div class="alerta-item" onclick="abrirDetalheObjeto('${escapeHtml(o.codigo)}')">
        <span class="al-cx"><span class="al-lbl">Caixa</span><b class="mono">${escapeHtml(o.codigo)}</b></span>
        <span><span class="al-lbl">Etapa</span><b>${et.nome}</b></span>
        <span class="al-op"><span class="al-lbl">Operador</span><b>${escapeHtml(d.operador||'—')}</b></span>
        <span><span class="al-lbl">Tempo</span><span class="al-dur">${fmtDur(d.inicio, d.fim)}</span></span>
        <span><span class="al-lbl">Término</span>${fmtDataCurta(d.fim)} ${fmtHoraCurta(d.fim)}</span>
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); marcarAlertaConferido('${escapeHtml(o.codigo)}','${et.k}')">Conferido</button>
      </div>`).join('')}</div>
  </div>`;
}

async function salvarEdicaoObjeto(codigo){
  await carregarObjetos();
  const lista = cacheObjetos.map(o=>{
    if(o.codigo!==codigo) return o;
    const novo = JSON.parse(JSON.stringify(o));
    novo.status = document.getElementById('edit-status').value;
    ['preparacao','captura','inspecao','indexacao'].forEach(campo=>{
      const inicioEl = document.getElementById(`edit-${campo}-inicio`);
      const fimEl = document.getElementById(`edit-${campo}-fim`);
      if(inicioEl) novo[campo].inicio = localParaISO(inicioEl.value);
      if(fimEl) novo[campo].fim = localParaISO(fimEl.value);
      const obsEl = document.getElementById(`edit-${campo}-obs`);
      if(obsEl) novo[campo].observacao = obsEl.value.trim() ? obsEl.value.trim() : null;
    });
    const qtdCaptura = document.getElementById('edit-captura-qtd');
    const qtdInspecao = document.getElementById('edit-inspecao-qtd');
    const qtdIndexacao = document.getElementById('edit-indexacao-qtd');
    if(qtdCaptura) novo.captura.qtdImagens = qtdCaptura.value ? parseInt(qtdCaptura.value,10) : null;
    if(qtdInspecao) novo.inspecao.qtdImagens = qtdInspecao.value ? parseInt(qtdInspecao.value,10) : null;
    const qtdRep = document.getElementById('edit-inspecao-replace');
    if(qtdRep) novo.inspecao.qtdReplace = qtdRep.value !== '' ? parseInt(qtdRep.value,10) : null;
    if(qtdIndexacao) novo.indexacao.qtdConjuntos = qtdIndexacao.value ? parseInt(qtdIndexacao.value,10) : null;
    return novo;
  });
  await salvarObjetos(lista);
  fecharModal();
  mostrarToast('Alterações salvas.');
  renderMainGestor();
}
async function excluirObjeto(codigo){
  if(!confirm(`Excluir permanentemente a caixa ${codigo}? Essa ação não pode ser desfeita.`)) return;
  await carregarObjetos();
  await ignorarNaImportacao([codigo]);
  await salvarObjetos(cacheObjetos.filter(o=>o.codigo!==codigo));
  fecharModal();
  mostrarToast(`Caixa ${codigo} excluída.`);

/* ---------- Produção por operador ---------- */
const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function anosDisponiveis(){
  const anos = new Set([new Date().getFullYear()]);
  cacheObjetos.forEach(o=>{
    if(o.criadoEm) anos.add(new Date(o.criadoEm).getFullYear());
    ['preparacao','captura','inspecao','indexacao'].forEach(c=>{
      if(o[c] && o[c].fim) anos.add(new Date(o[c].fim).getFullYear());
    });
  });
  return Array.from(anos).sort((a,b)=>b-a);
}

function calcularProducao(matricula, mes, ano){
  const r = {preparacoes:0, capturaCount:0, capturaQtd:0, inspecaoCount:0, inspecaoQtd:0, indexacaoCount:0, indexacaoQtd:0};
  const bateFiltro = (isoFim)=>{
    if(!isoFim) return false;
    const d = new Date(isoFim);
    if(mes && (d.getMonth()+1) !== Number(mes)) return false;
    if(ano && d.getFullYear() !== Number(ano)) return false;
    return true;
  };
  cacheObjetos.forEach(o=>{
    if(o.preparacao.matricula===matricula && bateFiltro(o.preparacao.fim)) r.preparacoes++;
    if(o.captura.matricula===matricula && bateFiltro(o.captura.fim)){ r.capturaCount++; r.capturaQtd += (o.captura.qtdImagens||0); }
    if(o.inspecao.matricula===matricula && bateFiltro(o.inspecao.fim)){ r.inspecaoCount++; r.inspecaoQtd += (o.inspecao.qtdImagens||0); }
    if(o.indexacao.matricula===matricula && bateFiltro(o.indexacao.fim)){ r.indexacaoCount++; r.indexacaoQtd += (o.indexacao.qtdConjuntos||0); }
  });
  return r;
}

/* =========================================================
   OS (ordens de serviço): início/fim da produção, registradas no dashboard.
   Cada OS finalizada guarda um relatório congelado (os.relatorio).
========================================================= */
let cacheOS = [];
async function carregarOS(){
  let v = null;
  try{ v = await Armazenar.get('os_producao'); }catch(e){}
  if(!v){ try{ v = localStorage.getItem('cepe_os'); }catch(e){} }
  try{ cacheOS = v ? JSON.parse(v) : []; }catch(e){ cacheOS = []; }
  if(!Array.isArray(cacheOS)) cacheOS = [];
  return cacheOS;
}
const osAberta = ()=> cacheOS.find(o=>!o.fim) || null;
const fmtDataBR = t => { const d = new Date(t); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
function osPorValor(v){ return v==='atual' ? osAberta() : (v && v!=='livre' ? cacheOS.find(o=>o.id===v) : null) || null; }

function resumirEventos(ev){
  const ops = new Map(), cls = new Map(), caixas = new Set();
  const t = {etapas:ev.length, caixas:0, capQtd:0, insQtd:0, idxQtd:0, w:0, g:0};
  ev.forEach(x=>{
    const id = x.matricula || x.operador;
    let l = ops.get(id);
    if(!l){ const u = cacheOperadores.find(o=>o.matricula===x.matricula);
      l = {nome:u ? u.nome : x.operador, mat:x.matricula||'', prep:0, cap:0, capQtd:0, ins:0, insQtd:0, idx:0, idxQtd:0, w:0, g:0, total:0}; ops.set(id, l); }
    const cn = x.cliente || 'Sem cliente'; let c = cls.get(cn);
    if(!c){ c = {nome:cn, cx:new Set(), etapas:0, capQtd:0, insQtd:0, idxQtd:0, w:0, g:0}; cls.set(cn, c); }
    const q = x.qtd || 0;
    if(x.k==='preparacao') l.prep++;
    else if(x.k==='captura'){ l.cap++; l.capQtd += q; c.capQtd += q; t.capQtd += q; }
    else if(x.k==='inspecao'){ l.ins++; l.insQtd += q; c.insQtd += q; t.insQtd += q; }
    else if(x.k==='indexacao'){ l.idx++; l.idxQtd += q; c.idxQtd += q; t.idxQtd += q; }
    l.w += x.w||0; l.g += x.g||0; l.total++; c.w += x.w||0; c.g += x.g||0; c.etapas++; c.cx.add(x.codigo);
    t.w += x.w||0; t.g += x.g||0; caixas.add(x.codigo);
  });
  t.caixas = caixas.size;
  return {totais:t,
    operadores:[...ops.values()].sort((a,b)=>b.total-a.total),
    clientes:[...cls.values()].map(c=>({nome:c.nome, caixas:c.cx.size, etapas:c.etapas, capQtd:c.capQtd, insQtd:c.insQtd, idxQtd:c.idxQtd, w:c.w, g:c.g})).sort((a,b)=>b.etapas-a.etapas)};
}

let ultimaProducao = null;
function dadosProducaoAtual(){
  const matFiltro = document.getElementById('filtro-prod-operador').value;
  const mes = document.getElementById('filtro-prod-mes').value, ano = document.getElementById('filtro-prod-ano').value;
  const os = osPorValor(document.getElementById('filtro-prod-os').value);
  let resumo, congelado = false;
  if(os && os.fim && os.relatorio){ resumo = os.relatorio; congelado = true; }
  else resumo = resumirEventos(eventosProducao(os ? {de:os.ini, ate:os.fim||0} : {mes, ano}));
  let linhas = resumo.operadores.filter(l=>!matFiltro || l.mat===matFiltro);
  if(!congelado){   /* mostra também quem ainda não produziu, como antes */
    const tem = new Set(linhas.map(l=>l.mat));
    cacheOperadores.filter(o=>(!matFiltro || o.matricula===matFiltro) && !tem.has(o.matricula))
      .forEach(o=>linhas.push({nome:o.nome, mat:o.matricula, prep:0, cap:0, capQtd:0, ins:0, insQtd:0, idx:0, idxQtd:0, w:0, g:0, total:0}));
  }
  return {os, resumo, congelado, linhas, matFiltro, mes, ano};
}

  }
  const T = d.linhas.reduce((a,l)=>{ a.prep+=l.prep; a.cap+=l.cap; a.capQtd+=l.capQtd; a.ins+=l.ins; a.insQtd+=l.insQtd; a.idx+=l.idx; a.idxQtd+=l.idxQtd; a.w+=l.w; a.g+=l.g; a.total+=l.total; return a; }, {prep:0,cap:0,capQtd:0,ins:0,insQtd:0,idx:0,idxQtd:0,w:0,g:0,total:0});
  container.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Operador</th><th>Preparações</th><th>Capturas (lotes)</th><th>Imagens capturadas</th>
        <th>Inspeções (lotes)</th><th>Imagens inspecionadas</th><th>Indexações (lotes)</th><th>Conjuntos indexados</th><th>Total de etapas</th>

      </tr></thead>

      </tbody>
      <tfoot><tr><td><b>Total</b></td><td>${T.prep}</td><td>${T.cap}</td><td>${T.capQtd}</td><td>${T.ins}</td><td>${T.insQtd}</td><td>${T.idx}</td><td>${T.idxQtd}</td><td><b>${T.total}</b></td><td>${fmtMs(T.w)}</td><td>${fmtMs(T.g)}</td></tr></tfoot>
    </table></div>
    <div class="hint" style="margin-top:10px;">Tempo útil = só o expediente (07:30–16:30, sem almoço e lanche). Tempo perdido = intervalo entre o fim de um lote e o início do próximo do mesmo operador, dentro do expediente.</div>

async function gestorCadastrarOperador(){
  const nome = document.getElementById('g-novo-op-nome').value.trim();
  const matricula = document.getElementById('g-novo-op-matricula').value.trim();
  const funcao = document.getElementById('g-novo-op-funcao').value.trim();
  const perfil = document.getElementById('g-novo-op-perfil').value === 'gestor' ? 'gestor' : 'operador';
  const login = document.getElementById('g-novo-op-login').value.trim().toLowerCase();
  const senha = document.getElementById('g-novo-op-senha').value;
  const etapas = perfil==='gestor' ? [] : lerEtapasMarcadas('g-novo-op');
  const errEl = document.getElementById('g-err-operador');
  errEl.textContent = '';
  if(!nome || !matricula || !login || !senha){ errEl.textContent = 'Preencha nome, matrícula, login e senha.'; return; }
  if(!validarLogin(login)){ errEl.textContent = 'Login: 3 a 30 letras minúsculas, números, ponto, hífen ou sublinhado (sem espaços). O login "admin" é reservado.'; return; }
  if(senha.length < 4){ errEl.textContent = 'A senha precisa ter pelo menos 4 caracteres.'; return; }
  if(perfil==='operador' && etapas.length===0){ errEl.textContent = 'Marque pelo menos uma etapa em que o operador trabalha.'; return; }
  await carregarOperadores();
  if(cacheOperadores.some(o=>o.matricula===matricula)){ errEl.textContent = 'Matrícula já cadastrada.'; return; }
  if(cacheOperadores.some(o=>o.login && o.login.toLowerCase()===login)){ errEl.textContent = 'Esse login já está em uso.'; return; }
  const novo = {nome, matricula, funcao, perfil, etapas, login, ativo:true, criadoEm:nowISO()};
  await definirSenha(novo, senha);
  if(await salvarOperadores([...cacheOperadores, novo])){
    mostrarToast('Usuário cadastrado.');
    renderMainGestor();
  }
}

async function gestorSalvarEdicao(matricula){
  const nome = document.getElementById('ed-nome').value.trim();
  const funcao = document.getElementById('ed-funcao').value.trim();
  const perfil = document.getElementById('ed-perfil').value === 'gestor' ? 'gestor' : 'operador';
  const login = document.getElementById('ed-login').value.trim().toLowerCase();
  const senha = document.getElementById('ed-senha').value;
  const etapas = perfil==='gestor' ? [] : lerEtapasMarcadas('ed');
  const errEl = document.getElementById('ed-err');
  errEl.textContent = '';
  await carregarOperadores();
  const o = cacheOperadores.find(x=>x.matricula===matricula);
  if(!o){ fecharModal(); return; }
  if(!nome){ errEl.textContent = 'Informe o nome.'; return; }
  if(!login){ errEl.textContent = 'Informe o login.'; return; }
  if(!validarLogin(login)){ errEl.textContent = 'Login: 3 a 30 letras minúsculas, números, ponto, hífen ou sublinhado.'; return; }
  if(cacheOperadores.some(x=>x.matricula!==matricula && x.login && x.login.toLowerCase()===login)){ errEl.textContent = 'Esse login já está em uso.'; return; }
  if(perfil==='operador' && etapas.length===0){ errEl.textContent = 'Marque pelo menos uma etapa em que o operador trabalha.'; return; }
  if(!o.senhaHash && !senha){ errEl.textContent = 'Defina uma senha para liberar o acesso.'; return; }
  if(senha && senha.length < 4){ errEl.textContent = 'A senha precisa ter pelo menos 4 caracteres.'; return; }
  const novo = {...o, nome, funcao, perfil, etapas, login};
  if(novo.ativo === undefined) novo.ativo = true;
  if(senha) await definirSenha(novo, senha);
  if(await salvarOperadores(cacheOperadores.map(x=>x.matricula===matricula ? novo : x))){
    fecharModal(); mostrarToast('Usuário atualizado.'); renderMainGestor();
  }
}
async function gestorAlternarAtivo(matricula){
  await carregarOperadores();
  const lista = cacheOperadores.map(o=> o.matricula===matricula ? {...o, ativo: o.ativo===false} : o);
